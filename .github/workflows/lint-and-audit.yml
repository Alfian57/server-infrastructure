---
name: Lint and Audit
'on':
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation tools
        run: |
          pip install 'ansible==12.1.0' ansible-lint yamllint 'PyYAML==6.0.3'
          ansible-galaxy collection install -r requirements.yml
      - name: Prepare validation inventory and encrypted placeholders when needed
        run: |
          set -euo pipefail
          umask 077
          cp inventory/hosts.ini.example inventory/hosts.ini
          python - <<'INNER'
          import os,subprocess
          from pathlib import Path
          password=os.environ.get('VAULT_PASSWORD') or 'ci-placeholder-password'
          Path('.vault_pass').write_text(password)
          if not os.environ.get('VAULT_PASSWORD'):
              for example in [Path('platform/vault.yml.example'),*Path('projects').glob('*/vault.yml.example')]:
                  subprocess.run(['ansible-vault','encrypt',str(example),'--output',str(example).removesuffix('.example'),'--encrypt-vault-id','default'],check=True)
          INNER
      - name: Select changed application groups
        run: |
          python - <<'INNER'
          import json,os,subprocess
          from pathlib import Path
          import yaml
          groups=list(yaml.safe_load(Path('projects/index.yml').read_text())['group_registry'])
          base=os.environ.get('BASE_SHA','')
          if base and set(base)!={'0'}:
              result=subprocess.run(['git','diff','--name-only',base,'HEAD'],capture_output=True,text=True)
              files=result.stdout.splitlines() if result.returncode==0 else []
              if files and all(p.startswith('projects/') and len(p.split('/'))>2 and p.split('/')[1] in groups for p in files):
                  groups=sorted({p.split('/')[1] for p in files})
          Path('.ansible-groups').write_text('\n'.join(groups)+'\n')
          print('Validation groups: '+', '.join(groups))
          INNER
      - name: Validate behavior, Ansible, and shell scripts
        run: make validate
      - name: Validate selected group catalogs and templates
        run: |
          set -euo pipefail
          while IFS= read -r group; do
            python scripts/catalog.py doctor --group "$group"
            python scripts/app-catalog.py env-check --group "$group"
            ansible-playbook playbooks/validate-context.yml -i localhost, -e "deployment_group=$group"
          done < .ansible-groups
      - name: Check YAML
        run: yamllint -c .yamllint .
      - name: Remove local vault password
        if: always()
        run: rm -f .vault_pass .ansible-groups
