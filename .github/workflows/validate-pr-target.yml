name: Validate PR Source

on:
  pull_request:
    branches:
      - main

jobs:
  validate-pr-source:
    name: Validate PR Source Branch
    runs-on: ubuntu-latest
    steps:
      - name: Verify source branch restrictions
        run: |
          TARGET_BRANCH="${{ github.base_ref }}"
          SOURCE_BRANCH="${{ github.head_ref }}"

          echo "Target branch: $TARGET_BRANCH"
          echo "Source branch: $SOURCE_BRANCH"

          if [[ "$SOURCE_BRANCH" =~ ^(feat|fix|refactor|chore|docs|test|hotfix)/ ]]; then
            echo "✅ Valid: PR to 'main' in server-infrastructure originates from valid branch '$SOURCE_BRANCH'."
            exit 0
          else
            echo "❌ Invalid: PR to 'main' in server-infrastructure must have prefix feat/*, fix/*, refactor/*, chore/*, docs/*, or test/*."
            echo "Detected source branch: '$SOURCE_BRANCH'"
            exit 1
          fi
