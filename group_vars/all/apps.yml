      dockerfile: "Dockerfile"
      workflow: "build-and-deploy.yml"
    app_port: 3000
    health_endpoint: "/health"
    env_template: "roles/applications/tugas-backend-api-setup/templates/.env.j2"
    networks: ["nginx_proxy_manager_network", "mysql_network"]
    use_prisma: true
    run_migrate: true
    run_fresh_migrate: false
    run_seeder: false
    proxy:
      domain: "tugas-backend-api.alfian-gading.my.id"
      scheme: "http"
      forward_host: "tugas-backend-api"
      forward_port: 3000
      caching_enabled: false
      websocket_support: false
      cloudflare_flexible: true
    dns:
      domain: "alfian-gading.my.id"
      records: ["tugas-backend-api"]
    databases:
      mysql: ["tugas_backend"]

