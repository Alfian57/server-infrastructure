mysql_databases: >-
  {{ portfolio_apps | map(attribute='databases') | select('defined')
  | map(attribute='mysql') | select('defined') | flatten | unique | list }}
mysql_database_users:
  - database: "location_based_presence"
    username: "{{ vault_location_based_presence_web_db_username }}"
    password: "{{ vault_location_based_presence_web_db_password }}"
  - database: "pelelangan_produk_fashion"
    username: "{{ vault_lelang_fashion_web_db_username }}"
    password: "{{ vault_lelang_fashion_web_db_password }}"
  - database: "pos_soto_saben"
    username: "{{ vault_pos_soto_saben_db_username }}"
    password: "{{ vault_pos_soto_saben_db_password }}"
postgres_databases: >-
  {{
    (
      (
        portfolio_apps | map(attribute='databases') | select('defined')
        | map(attribute='postgres') | select('defined') | flatten | list
      )
      + (pui_app.databases.postgres | default([]))
    )
    | unique | list
  }}
postgres_database_users:
  - database: "sistertika_uty"
    username: "{{ vault_sistertika_uty_api_db_username }}"
    password: "{{ vault_sistertika_uty_api_db_password }}"
  - database: "pui"
    username: "{{ vault_pui_db_username }}"
    password: "{{ vault_pui_db_password }}"
  - database: "solvo_tech"
    username: "{{ vault_aldera_db_username | default(vault_solvo_db_username) }}"
    password: "{{ vault_aldera_db_password | default(vault_solvo_db_password) }}"
  - database: "gamblock"
    username: "{{ vault_gamblock_backend_db_username | default('gamblock') }}"
    password: "{{ vault_gamblock_backend_db_password | default(vault_postgres_password) }}"
portfolio_repositories: "{{ portfolio_apps | map(attribute='repo') | unique | list }}"
portfolio_proxy_hosts: >-
  {{
    ((portfolio_apps | selectattr('enabled', 'undefined') | list)
    + (portfolio_apps | selectattr('enabled', 'defined') | rejectattr('enabled', 'equalto', false) | list))
    | map(attribute='proxy') | select('defined') | list
    + (pui_app.proxy_hosts | default([]) if pui_app.enabled | default(true) else [])
    + (manual_proxy_hosts | default([]))
  }}
