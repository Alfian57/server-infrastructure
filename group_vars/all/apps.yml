---
# Central application catalog. Add/edit applications here first.

env_contract_defaults:
  path: ".env.example"
  ref: ""
  required: true
  ignore_keys: []

github_actions_defaults:
  secrets:
    VPS_HOST:
      source: "runtime:vps_host"
    VPS_USER:
      source: "runtime:ci_deploy_user"
    VPS_SSH_PORT:
      source: "runtime:vps_ssh_port"
    VPS_KEY:
      source: "runtime:vps_key"
    DOCKER_TOKEN:
      source: "vault:vault_github_token"
  variables: {}

pui_app:
  name: "pui"
  enabled: true
  repo: "PUI"
  stack: "compose"
  build:
    workflow: "ci-cd.yml"
  env_template: "roles/applications/pui-setup/templates/.env.j2"
  env_contract:
    path: ".env.example"
  images:
    web: "ghcr.io/alfian57/pui-web-client:latest"
    api: "ghcr.io/alfian57/pui-api-service:latest"
    vault: "ghcr.io/alfian57/pui-vault-core:latest"
  ci:
    variables:
      VITE_API_BASE_URL:
        value: "https://pui-api.alfian-gading.my.id"
      VITE_ENVIRONMENT_NAME:
        value: "production"
  proxy_hosts:
    - subdomain: "pui"
      scheme: "http"
      forward_host: "pui-web-client"
      forward_port: 80
      caching_enabled: true
      websocket_support: false
      cloudflare_flexible: true
    - subdomain: "pui-api"
      scheme: "http"
      forward_host: "pui-api-service"
      forward_port: 8080
      caching_enabled: false
      websocket_support: false
      cloudflare_flexible: true
  dns:
    domain: "alfian-gading.my.id"
    records: ["pui", "pui-api"]
  databases:
    postgres: ["pui"]

manual_proxy_hosts: []

