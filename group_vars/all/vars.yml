---
# ============================================================================
# Non-Sensitive Variables (Plain Text)
# ============================================================================
# File ini berisi variabel yang tidak sensitive dan tidak perlu dienkripsi
# Untuk credential dan secret, lihat vault.yml

# ============================================================================
# Role Toggle (Enable/Disable individual roles)
# ============================================================================
# System
enable_update_apt: true
enable_users_setup: true
enable_git_setup: true

# Security
enable_security_hardening: true

# Infrastructure
enable_docker_setup: true
enable_autoheal: true
enable_nginx_proxy: true
enable_minio: false
enable_cloudflare_warp: true

# Databases
enable_mysql: true
enable_postgres: true
enable_redis: true

# Applications
enable_portfolio_apps: true
enable_pui_app: true

# Optimization
enable_cost_optimization: true

# ============================================================================
# Global Configuration (Single Source of Truth)
# ============================================================================
# GitHub Configuration
github_registry: "ghcr.io"
github_username: "alfian57"

# Primary Domain
primary_domain: "alfian-gading.my.id"

# Managed domains, DNS records, repositories, proxy hosts, and app databases are
# now defined in group_vars/all/apps.yml.

# SSH Configuration
ssh_key_name: "server_ed25519"
ssh_key_path: "~/.ssh/{{ ssh_key_name }}"
deploy_user: "deployer"
ci_deploy_user: "app-deployer"
ssh_port: 22

# ============================================================================
# Docker Configuration
# ============================================================================
docker_registry: "ghcr.io"
docker_compose_version: "2.x"

# Network Names
nginx_proxy_network: "nginx_proxy_manager_network"
mysql_network: "mysql_network"
postgres_network: "postgres_network"
redis_network: "redis_network"

# Application Defaults
app_environment: "production"
app_log_level: "info"

# Paths
docker_stack_base: "/opt/docker-stack"
docker_stack_infrastructure: "{{ docker_stack_base }}/infrastructure"
docker_stack_databases: "{{ docker_stack_base }}/databases"
docker_stack_applications: "{{ docker_stack_base }}/applications"

# Image preferences. The host-profile role selects the effective images per VPS.
mysql_engine: "auto"
mysql_prefer_mysql: true
mysql_modern_image: "mysql:8.4"
mysql_legacy_image: "mariadb:10.11"
postgres_preferred_image: "postgres:18-bookworm"
redis_preferred_image: "redis:8"
nginx_proxy_preferred_version: "2.14.0"
nginx_proxy_armv7_version: "2.13.7"
autoheal_preferred_image: "willfarrell/autoheal:latest"
minio_preferred_image: "minio/minio:latest"
minio_legacy_cpu_image: "minio/minio:RELEASE.2025-04-22T22-12-26Z-cpuv1"

# ============================================================================
# User Configuration
# ============================================================================
users:
  - name: "deployer"
    comment: "Ansible Automation User"
    groups: ["sudo", "docker"]
    shell: "/bin/bash"
    password: "{{ vault_user_deployer_password }}"
    ssh_key: "{{ vault_server_ssh_public_key }}"
    state: "present"
    system: false
    sudo_nopasswd: true

  - name: "app-deployer"
    comment: "GitHub Actions Application Deploy User"
    groups: ["docker"]
    shell: "/bin/bash"
    ssh_key: "{{ vault_server_ssh_public_key }}"
    state: "present"
    system: false
    password_lock: true
    sudo_nopasswd: false

  - name: "alfiang"
    comment: "Alfian Gading"
    groups: ["sudo", "docker"]
    shell: "/bin/bash"
    password: "{{ vault_user_alfiang_password }}"
    ssh_key: "{{ vault_server_ssh_public_key }}"
    state: "present"
    system: false
    sudo_nopasswd: true
