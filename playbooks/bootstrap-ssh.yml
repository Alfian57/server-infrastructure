---
# ============================================================================
# SSH Key Bootstrap Playbook
# ============================================================================
# This playbook sets up SSH key authentication on fresh VPS
# Run this FIRST before the main server-setup.yml playbook
# 
# Usage:
#   make prepare-bootstrap
#   make bootstrap-password
#   OR: make bootstrap-key
# ============================================================================

- name: Bootstrap SSH Key Authentication
  hosts: all
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all/vars.yml
    - ../group_vars/all/vault.yml
  vars:
    ssh_public_key_path: "~/.ssh/{{ ssh_key_name }}.pub"
    ssh_private_key_path: "~/.ssh/{{ ssh_key_name }}"
    
    # Users to configure SSH key for
    users_to_setup:
      - root
      - "{{ deploy_user }}"
      - alfiang

  pre_tasks:
    - name: Wait for SSH connection
      ansible.builtin.wait_for_connection:
        timeout: 60

    - name: Gather facts
      ansible.builtin.setup:

    - name: Display bootstrap information
      ansible.builtin.debug:
        msg:
          - "═══════════════════════════════════════════════════════════"
          - "  SSH Key Bootstrap"
          - "═══════════════════════════════════════════════════════════"
          - "  Server: {{ inventory_hostname }}"
          - "  Initial SSH user: {{ ansible_user }}"
          - "  OS: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
          - "═══════════════════════════════════════════════════════════"

  tasks:
    # =========================================================================
    # Read Local SSH Public Key
    # =========================================================================
    - name: Read local SSH public key
      ansible.builtin.set_fact:
        ssh_public_key: "{{ lookup('file', ssh_public_key_path) }}"
      delegate_to: localhost
      become: false

    - name: Display SSH public key (first 50 chars)
      ansible.builtin.debug:
        msg: "Using SSH key: {{ ssh_public_key[:50] }}..."

    # =========================================================================
    # Setup SSH Directory for Root
    # =========================================================================
    - name: Ensure .ssh directory exists for root
      ansible.builtin.file:
        path: /root/.ssh
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Add SSH key to root authorized_keys
      ansible.posix.authorized_key:
        user: root
        key: "{{ ssh_public_key }}"
        state: present
        exclusive: false

    # =========================================================================
    # Create Additional Users (if not exist)
    # =========================================================================
    - name: Ensure deploy user exists
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        comment: "Ansible Automation & CI/CD Deploy User"
        groups: ["sudo"]
        shell: /bin/bash
        password: "{{ vault_user_deployer_password }}"
        createhome: true
        state: present

    - name: Ensure alfiang user exists
      ansible.builtin.user:
        name: alfiang
        comment: "Alfian Gading"
        groups: ["sudo"]
        shell: /bin/bash
        createhome: true
        state: present

    # =========================================================================
    # Configure Passwordless Sudo for Deploy User
    # =========================================================================
    - name: Configure passwordless sudo for deploy user
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/{{ deploy_user }}
        line: "{{ deploy_user }} ALL=(ALL) NOPASSWD: ALL"
        create: true
        mode: "0440"
        validate: "visudo -cf %s"

    - name: Configure passwordless sudo for alfiang user
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/alfiang
        line: "alfiang ALL=(ALL) NOPASSWD: ALL"
        create: true
        mode: "0440"
        validate: "visudo -cf %s"

    # =========================================================================
    # Setup SSH Directory for All Users
    # =========================================================================
    - name: Ensure .ssh directory exists for deploy user
      ansible.builtin.file:
        path: "/home/{{ deploy_user }}/.ssh"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0700"

    - name: Ensure .ssh directory exists for alfiang
      ansible.builtin.file:
        path: /home/alfiang/.ssh
        state: directory
        owner: alfiang
        group: alfiang
        mode: "0700"

    - name: Add SSH key to deploy user authorized_keys
      ansible.posix.authorized_key:
        user: "{{ deploy_user }}"
        key: "{{ ssh_public_key }}"
        state: present
        exclusive: false

    - name: Add SSH key to alfiang authorized_keys
      ansible.posix.authorized_key:
        user: alfiang
        key: "{{ ssh_public_key }}"
        state: present
        exclusive: false

    # =========================================================================
    # Configure SSHD
    # =========================================================================
    - name: Backup original sshd_config
      ansible.builtin.copy:
        src: /etc/ssh/sshd_config
        dest: /etc/ssh/sshd_config.backup
        remote_src: true
        mode: "0600"
        force: false

    - name: Enable PubkeyAuthentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PubkeyAuthentication"
        line: "PubkeyAuthentication yes"
        state: present
      notify: Restart SSHD

    - name: Set AuthorizedKeysFile path
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?AuthorizedKeysFile"
        line: "AuthorizedKeysFile .ssh/authorized_keys"
        state: present
      notify: Restart SSHD

    # =========================================================================
    # Test SSH Key Authentication Before Disabling Password
    # =========================================================================
    - name: Flush handlers to apply SSH config
      ansible.builtin.meta: flush_handlers

    - name: Test SSH key authentication
      ansible.builtin.command:
        cmd: "ssh -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=no -p {{ ansible_port | default(22) }} -i {{ ssh_private_key_path }} root@{{ inventory_hostname }} echo 'SSH key auth works'"
      delegate_to: localhost
      become: false
      register: ssh_test
      ignore_errors: true
      changed_when: false

    - name: Display SSH test result
      ansible.builtin.debug:
        msg: "SSH Key authentication test: {{ 'SUCCESS' if ssh_test.rc == 0 else 'FAILED' }}"

    - name: Warning if SSH key test failed
      ansible.builtin.debug:
        msg: 
          - "⚠️  WARNING: SSH key authentication test failed!"
          - "Password authentication has NOT been disabled for safety."
          - "Please check your SSH key configuration and try again."
      when: ssh_test.rc != 0

  handlers:
    - name: Restart SSHD
      ansible.builtin.service:
        name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
        state: restarted

  post_tasks:
    # =========================================================================
    # Test SSH Key Authentication for Deploy User
    # =========================================================================
    - name: Test SSH key authentication for deploy user
      ansible.builtin.command:
        cmd: "ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -p {{ ansible_port | default(22) }} -i {{ ssh_private_key_path }} {{ deploy_user }}@{{ inventory_hostname }} echo 'Deploy user SSH auth works'"
      delegate_to: localhost
      become: false
      register: deployer_ssh_test
      ignore_errors: true
      changed_when: false

    - name: Display deploy user SSH test result
      ansible.builtin.debug:
        msg: "{{ deploy_user }} SSH authentication: {{ '✓ SUCCESS' if deployer_ssh_test.rc == 0 else '✗ FAILED' }}"

    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "═══════════════════════════════════════════════════════════"
          - "  ✓ SSH Key Bootstrap Complete!"
          - "═══════════════════════════════════════════════════════════"
          - ""
          - "  SSH Key configured for users:"
          - "    - root"
          - "    - {{ deploy_user }} {{ '✓' if deployer_ssh_test.rc == 0 else '✗' }}"
          - "    - alfiang"
          - ""
          - "  {{ 'Password authentication: DISABLED' if ssh_test.rc == 0 else 'Password authentication: STILL ENABLED (SSH key test failed)' }}"
          - ""
          - "  Next steps:"
          - "  1. Run: make switch-to-ssh (to update inventory)"
          - "  2. Run: make deploy"
          - ""
          - "═══════════════════════════════════════════════════════════"
