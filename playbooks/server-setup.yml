---
- name: Setup Server Playbook
  hosts: all
  gather_facts: true
  become: true

  vars_files:
    - ../group_vars/all/vars.yml
    - ../group_vars/all/apps.yml
    - ../group_vars/all/vault.yml
  
  vars:
    # Control which role categories to run
    setup_system: true
    setup_security: true
    setup_infrastructure: true
    setup_databases: true
    setup_applications: true
    setup_optimization: true
    reboot_at_end: false

  pre_tasks:
    - name: Validate minimum Ansible version
      ansible.builtin.assert:
        that:
          - ansible_version.full is version('2.12', '>=')
        fail_msg: "This playbook requires Ansible 2.12 or higher"
        quiet: true
      tags: always

    - name: Ensure server is reachable
      ansible.builtin.ping:
      tags: always

    - name: Display server information
      ansible.builtin.debug:
        msg:
          - "═══════════════════════════════════════════════════════════"
          - "  Server Setup - {{ inventory_hostname }}"
          - "═══════════════════════════════════════════════════════════"
          - "  OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "  Kernel: {{ ansible_kernel }}"
          - "  Architecture: {{ ansible_architecture }}"
          - "  IPv4: {{ ansible_default_ipv4.address | default('N/A') }}"
          - "═══════════════════════════════════════════════════════════"
      tags: always

  roles:
    # ═══════════════════════════════════════════════════════════
    # SYSTEM SETUP
    # Basic system configuration and tools
    # ═══════════════════════════════════════════════════════════
    - role: host-profile
      tags: [always, system, host-profile]

    - role: update-apt
      tags: [system, update-apt]
      when:
        - setup_system | bool
        - ansible_os_family == 'Debian'

    - role: users-setup
      tags: [system, users-setup]
      when: setup_system | bool

    - role: git-setup
      tags: [system, git-setup]
      when: setup_system | bool

    # NOTE: github-cli-setup and cloudflare-dns-setup are now run locally via:
    #   make update-github-secrets
    #   make update-cloudflare-dns

    # ═══════════════════════════════════════════════════════════
    # SECURITY HARDENING
    # Firewall, Fail2ban, SSH hardening, system security
    # ═══════════════════════════════════════════════════════════
    - role: security-hardening
      tags: [security, security-hardening]
      when:
        - setup_security | bool
        - ansible_os_family == 'Debian'

    # ═══════════════════════════════════════════════════════════
    # INFRASTRUCTURE
    # Docker, reverse proxy, container management, object storage
    # ═══════════════════════════════════════════════════════════
    - role: docker-setup
      tags: [infrastructure, docker-setup]
      when: setup_infrastructure | bool

    - role: autoheal-setup
      tags: [infrastructure, autoheal-setup]
      when: setup_infrastructure | bool

    - role: nginx-proxy-setup
      tags: [infrastructure, nginx-proxy-setup]
      when: setup_infrastructure | bool

    - role: minio-setup
      tags: [infrastructure, minio-setup]
      when: setup_infrastructure | bool

    - role: cloudflare-warp-setup
      tags: [infrastructure, cloudflare-warp-setup]
      when:
        - setup_infrastructure | bool
        - ansible_os_family == 'Debian'

    # ═══════════════════════════════════════════════════════════
    # DATABASES
    # MySQL, PostgreSQL, Redis
    # ═══════════════════════════════════════════════════════════
    - role: mysql-setup
      tags: [database, mysql-setup]
      when: setup_databases | bool

    - role: postgres-setup
      tags: [database, postgres-setup]
      when: setup_databases | bool

    - role: redis-setup
      tags: [database, redis-setup]
      when: setup_databases | bool

    # ═══════════════════════════════════════════════════════════
    # APPLICATIONS
    # Generic catalog-driven application deployments.
    # Edit group_vars/all/apps.yml to add/change apps.
    # ═══════════════════════════════════════════════════════════
    - role: portfolio-apps
      tags: [application, portfolio-apps]
      when: setup_applications | bool

    # ═══════════════════════════════════════════════════════════
    # OPTIMIZATION
    # Cost optimization, cleanup, monitoring
    # ═══════════════════════════════════════════════════════════
    - role: cost-optimization
      tags: [optimization, cost-optimization]
      when:
        - setup_optimization | bool
        - ansible_os_family == 'Debian'

  post_tasks:
    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "═══════════════════════════════════════════════════════════"
          - "  ✓ Server Setup Complete!"
          - "═══════════════════════════════════════════════════════════"
          - ""
          - "  All roles have been executed successfully."
          - "  Reboot is disabled by default. Run `make reboot-if-required` when needed."
          - ""
          - "═══════════════════════════════════════════════════════════"
      tags: always

    - name: Reboot server and wait for it to come back
      ansible.builtin.reboot:
        msg: "Rebooting server after Ansible setup completion"
        reboot_timeout: 300
        pre_reboot_delay: 5
        post_reboot_delay: 30
      when: reboot_at_end | bool
      tags: always

    - name: Display post-reboot message
      ansible.builtin.debug:
        msg:
          - "═══════════════════════════════════════════════════════════"
          - "  ✓ Server Reboot Complete!"
          - "═══════════════════════════════════════════════════════════"
          - ""
          - "  Next Steps:"
          - "  1. Verify services: make status"
          - "  2. Check containers: make containers"
          - "  3. Check security: sudo security-check"
          - "  4. View logs: make logs"
          - ""
          - "═══════════════════════════════════════════════════════════"
      when: reboot_at_end | bool
      tags: always
