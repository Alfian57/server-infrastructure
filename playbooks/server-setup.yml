---
- name: Setup Server Playbook
  hosts: all
  gather_facts: true
  become: true

  vars_files:
    - ../group_vars/all/vars.yml
    - ../group_vars/all/apps.yml
    - ../group_vars/all/vault.yml
  
  vars:
    # Control which role categories to run
    setup_system: true
    setup_security: true
    setup_infrastructure: true
    setup_databases: true
    setup_applications: true
    setup_optimization: true
    reboot_at_end: false
    portfolio_app_filter: "{{ app | default('') }}"
    portfolio_apps_enabled: >-
      {{
        (portfolio_apps | selectattr('enabled', 'undefined') | list)
        + (portfolio_apps | selectattr('enabled', 'defined') | rejectattr('enabled', 'equalto', false) | list)
      }}
    portfolio_apps_for_run: >-
      {{
        portfolio_apps_enabled
        if portfolio_app_filter | length == 0
        else (portfolio_apps_enabled | selectattr('name', 'equalto', portfolio_app_filter) | list)
      }}
    warp_required_for_run: >-
      {{
        (portfolio_apps_for_run
        | selectattr('requires_warp_proxy', 'defined')
        | selectattr('requires_warp_proxy', 'equalto', true)
        | list
        | length) > 0
      }}

  pre_tasks:
    - name: Validate minimum Ansible version
      ansible.builtin.assert:
        that:
          - ansible_version.full is version('2.12', '>=')
        fail_msg: "This playbook requires Ansible 2.12 or higher"
        quiet: true
      tags: always

    - name: Ensure server is reachable
      ansible.builtin.ping:
      tags: always

    - name: Display server information
      ansible.builtin.debug:
        msg:
          - "═══════════════════════════════════════════════════════════"
          - "  Server Setup - {{ inventory_hostname }}"
          - "═══════════════════════════════════════════════════════════"
          - "  OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "  Kernel: {{ ansible_kernel }}"
          - "  Architecture: {{ ansible_architecture }}"
          - "  IPv4: {{ ansible_default_ipv4.address | default('N/A') }}"
          - "═══════════════════════════════════════════════════════════"
      tags: always

    - name: "Cleanup disabled MinIO container"
      when: not (enable_minio | bool)
      tags: [infrastructure, minio-setup]
      block:
        - name: Check if MinIO compose file exists
          ansible.builtin.stat:
            path: "{{ docker_stack_infrastructure }}/minio/docker-compose.yml"
          register: minio_compose_file_check

        - name: Stop and remove MinIO container
          community.docker.docker_compose_v2:
            project_src: "{{ docker_stack_infrastructure }}/minio"
            state: absent
            remove_orphans: true
          when: minio_compose_file_check.stat.exists

  roles:
    # ═══════════════════════════════════════════════════════════
    # SYSTEM SETUP
    # Basic system configuration and tools
    # ═══════════════════════════════════════════════════════════
    - role: host-profile
      tags: [always, system, host-profile]

    - role: swap-setup
      tags: [system, swap-setup]
      when:
        - setup_system | bool
        - enable_swap | bool
        - ansible_os_family == 'Debian'

    - role: update-apt
      tags: [system, update-apt]
      when:
        - setup_system | bool
        - enable_update_apt | bool
        - ansible_os_family == 'Debian'

    - role: users-setup
      tags: [system, users-setup]
      when:
        - setup_system | bool
        - enable_users_setup | bool

    - role: git-setup
      tags: [system, git-setup]
      when:
        - setup_system | bool
        - enable_git_setup | bool

    # NOTE: github-cli-setup and cloudflare-dns-setup are now run locally via:
    #   make update-github-secrets
    #   make update-cloudflare-dns

    # ═══════════════════════════════════════════════════════════
    # SECURITY HARDENING
    # Firewall, Fail2ban, SSH hardening, system security
    # ═══════════════════════════════════════════════════════════
    - role: security-hardening
      tags: [security, security-hardening]
      when:
        - setup_security | bool
        - enable_security_hardening | bool
        - ansible_os_family == 'Debian'

    # ═══════════════════════════════════════════════════════════
    # INFRASTRUCTURE
    # Docker, reverse proxy, container management, object storage
    # ═══════════════════════════════════════════════════════════
    - role: docker-setup
      tags: [infrastructure, docker-setup]
      when:
        - setup_infrastructure | bool
        - enable_docker_setup | bool

    - role: autoheal-setup
      tags: [infrastructure, autoheal-setup]
      when:
        - setup_infrastructure | bool
        - enable_autoheal | bool

    - role: nginx-proxy-setup
      tags: [infrastructure, nginx-proxy-setup]
      when:
        - setup_infrastructure | bool
        - enable_nginx_proxy | bool

    - role: minio-setup
      tags: [infrastructure, minio-setup]
      when:
        - setup_infrastructure | bool
        - enable_minio | bool

    - role: cloudflare-warp-setup
      tags: [infrastructure, cloudflare-warp-setup]
      when:
        - setup_infrastructure | bool
        - enable_cloudflare_warp | bool
        - ansible_os_family == 'Debian'
        - warp_required_for_run | bool

    # ═══════════════════════════════════════════════════════════
    # DATABASES
    # MySQL, PostgreSQL, Redis
    # ═══════════════════════════════════════════════════════════
    - role: mysql-setup
      tags: [database, mysql-setup]
      when:
        - setup_databases | bool
        - enable_mysql | bool

    - role: postgres-setup
      tags: [database, postgres-setup]
      when:
        - setup_databases | bool
        - enable_postgres | bool

    - role: redis-setup
      tags: [database, redis-setup]
      when:
        - setup_databases | bool
        - enable_redis | bool

    # ═══════════════════════════════════════════════════════════
    # APPLICATIONS
    # Generic catalog-driven application deployments.
    # Edit group_vars/all/apps.yml to add/change apps.
    # ═══════════════════════════════════════════════════════════
    - role: portfolio-apps
      tags: [application, portfolio-apps]
      when:
        - setup_applications | bool
        - enable_portfolio_apps | bool

    - role: pui-setup
      tags: [application, pui-setup]
      when:
        - setup_applications | bool
        - enable_pui_app | bool

    # ═══════════════════════════════════════════════════════════
    # OPTIMIZATION
    # Cost optimization, cleanup, monitoring
    # ═══════════════════════════════════════════════════════════
    - role: cost-optimization
      tags: [optimization, cost-optimization]
      when:
        - setup_optimization | bool
        - enable_cost_optimization | bool
        - ansible_os_family == 'Debian'

  post_tasks:
    - name: Apply final Docker hardening
      ansible.builtin.include_role:
        name: security-hardening
        tasks_from: docker-security
        apply:
          tags:
            - infrastructure
            - docker-setup
            - security
            - security-docker
            - docker-hardening
            - final-docker-hardening
      when:
        - setup_security | bool
        - setup_infrastructure | bool
        - ansible_os_family == 'Debian'
      tags:
        - infrastructure
        - docker-setup
        - security
        - security-docker
        - docker-hardening
        - final-docker-hardening

    - name: Flush final Docker hardening handlers
      ansible.builtin.meta: flush_handlers
      tags:
        - infrastructure
        - docker-setup
        - security
        - security-docker
        - docker-hardening
        - final-docker-hardening

    - name: Apply final SSH hardening
      ansible.builtin.include_role:
        name: security-hardening
        tasks_from: ssh-hardening
        apply:
          tags:
            - security
            - security-ssh
            - ssh-hardening
            - final-ssh-hardening
      when:
        - setup_security | bool
        - security_ssh_defer_until_end | default(true) | bool
        - ansible_os_family == 'Debian'
      tags:
        - security
        - security-ssh
        - ssh-hardening
        - final-ssh-hardening

    - name: Flush final SSH hardening handlers
      ansible.builtin.meta: flush_handlers
      tags:
        - security
        - security-ssh
        - ssh-hardening
        - final-ssh-hardening

    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "═══════════════════════════════════════════════════════════"
          - "  ✓ Server Setup Complete!"
          - "═══════════════════════════════════════════════════════════"
          - ""
          - "  All roles have been executed successfully."
          - "  Reboot is disabled by default. Run `make reboot-if-required` when needed."
          - ""
          - "═══════════════════════════════════════════════════════════"
      tags: always

    - name: Reboot server and wait for it to come back
      ansible.builtin.reboot:
        msg: "Rebooting server after Ansible setup completion"
        reboot_timeout: 300
        pre_reboot_delay: 5
        post_reboot_delay: 30
      when: reboot_at_end | bool
      tags: always

    - name: Display post-reboot message
      ansible.builtin.debug:
        msg:
          - "═══════════════════════════════════════════════════════════"
          - "  ✓ Server Reboot Complete!"
          - "═══════════════════════════════════════════════════════════"
          - ""
          - "  Next Steps:"
          - "  1. Verify services: make status"
          - "  2. Check containers: make containers"
          - "  3. Check security: sudo security-check"
          - "  4. View logs: make logs"
          - ""
          - "═══════════════════════════════════════════════════════════"
      when: reboot_at_end | bool
      tags: always
