---
retired_apps:
  - name: posyandu
    repo: posyandu-digital
    stack: laravel
    networks:
      - nginx_proxy_manager_network
      - mysql_network
      - redis_network
    volumes:
      - posyandu_storage:/var/www/storage
    proxy:
      subdomain: posyandu
      scheme: http
      forward_host: posyandu
      forward_port: 80
      caching_enabled: true
      websocket_support: false
      cloudflare_flexible: true
    dns:
      domain: alfian-gading.my.id
      records:
        - posyandu
    databases:
      mysql:
        - posyandu
  - name: materi-ku
    repo: materi-ku
