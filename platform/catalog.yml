---
env_contract_defaults:
  path: .env.example
  ref: ''
  required: true
  ignore_keys: []
github_actions_defaults:
  secrets:
    VPS_HOST:
      source: runtime:vps_host
    VPS_USER:
      source: runtime:ci_deploy_user
    VPS_PASSWORD:
      source: runtime:vps_password
    VPS_SSH_PORT:
      source: runtime:vps_ssh_port
    VPS_KEY:
      source: runtime:vps_key
    DOCKER_TOKEN:
      source: vault:vault_github_token
  variables: {}
manual_proxy_hosts:
  - domain: api.aldera.tech
    scheme: http
    forward_host: billing-proxy
    forward_port: 8080
    caching_enabled: false
    websocket_support: true
    cloudflare_flexible: true
    force_ssl: true
  - domain: router.aldera.tech
    scheme: http
    forward_host: 9router
    forward_port: 20128
    caching_enabled: false
    websocket_support: false
    cloudflare_flexible: true
    force_ssl: true
