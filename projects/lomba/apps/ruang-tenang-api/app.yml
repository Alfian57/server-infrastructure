---
name: ruang-tenang-api
repo: ruang-tenang-api
stack: golang
build:
  dockerfile: Dockerfile
  workflow: build-and-deploy.yml
app_port: 8080
health_endpoint: /health
env_template: projects/lomba/apps/ruang-tenang-api/.env.j2
networks:
  - nginx_proxy_manager_network
  - mysql_network
  - redis_network
volumes:
  - ruang_tenang_api_uploads:/app/uploads
run_migrate: true
run_fresh_migrate: false
run_seeder: false
proxy:
  domain: api.ruang-tenang.my.id
  scheme: http
  forward_host: ruang-tenang-api
  forward_port: 8080
  caching_enabled: false
  websocket_support: false
  cloudflare_flexible: true
dns:
  domain: ruang-tenang.my.id
  records:
    - api
databases:
  mysql:
    - '{{ vault_ruang_tenang_api_db_name | default(''ruang_tenang'') }}'
enabled: true
deployment: portfolio
group: lomba
requires:
  - nginx
  - mysql
  - redis
database_users:
  - database: '{{ vault_ruang_tenang_api_db_name | default(''ruang_tenang'') }}'
    username: '{{ vault_ruang_tenang_api_db_user | default(''ruang_tenang'') }}'
    password: '{{ vault_ruang_tenang_api_db_password }}'
env_contract:
  ignore_keys:
    - HTTP_PROXY
    - HTTPS_PROXY
    - http_proxy
    - https_proxy
    - NO_PROXY
    - no_proxy
