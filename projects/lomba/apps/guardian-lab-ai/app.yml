---
name: guardian-lab-ai
enabled: true
repo_owner: DeryWahyu
repo: guardian-lab-ai
stack: compose
deploy_tag: guardian-lab-setup
app_port: 8001
image: ghcr.io/derywahyu/guardian-lab-ai:latest
build:
  dockerfile: Dockerfile
  workflow: ml.yml
env_template: projects/lomba/apps/guardian-lab-ai/.env.j2
ci:
  inherit_defaults: false
  secrets:
    VPS_HOST:
      source: runtime:vps_host
    VPS_USER:
      source: runtime:ci_deploy_user
    VPS_SSH_PORT:
      source: runtime:vps_ssh_port
    VPS_KEY:
      source: runtime:vps_key
    VPS_KNOWN_HOSTS:
      source: vault:vault_guardian_lab_ssh_known_hosts
  variables:
    ENABLE_VPS_DEPLOY:
      value: 'true'
deployment: guardian
group: lomba
requires: []
database_users: []
