---
name: ruang-tenang-web
repo: ruang-tenang-web
stack: nextjs
build:
  dockerfile: Dockerfile
  workflow: build-and-deploy.yml
app_port: 3000
env_template: projects/lomba/apps/ruang-tenang-web/.env.j2
ci:
  variables:
    NEXT_PUBLIC_API_BASE_URL:
      source: vault:vault_ruang_tenang_web_api_url
    NEXT_PUBLIC_API_URL:
      source: vault:vault_ruang_tenang_web_api_url
    NEXT_PUBLIC_APP_TIMEZONE:
      value: Asia/Jakarta
    NEXT_PUBLIC_ALLOWED_IMAGE_HOSTS:
      value: api.ruang-tenang.my.id
    NEXT_PUBLIC_MIDTRANS_ENV:
      value: production
    NEXT_PUBLIC_DUITKU_ENV:
      value: sandbox
networks:
  - nginx_proxy_manager_network
proxy:
  domain: ruang-tenang.my.id
  scheme: http
  forward_host: ruang-tenang-web
  forward_port: 3000
  caching_enabled: false
  websocket_support: false
  cloudflare_flexible: true
dns:
  domain: ruang-tenang.my.id
  records:
    - '@'
enabled: true
deployment: portfolio
group: lomba
requires:
  - nginx
database_users: []
