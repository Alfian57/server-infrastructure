---
mobile_repositories:
  - name: location-based-presence-mobile
    enabled: false
    repo_owner: AlderaTech
    build:
      workflow: mobile.yml
    variables:
      API_BASE_URL: https://location-based-presence.alfian-gading.my.id/api/mobile
      API_BASE_URL_DEBUG: https://thankful-midge-noble.ngrok-free.app/api/mobile
    ci:
      variables:
        API_BASE_URL:
          source: vault:vault_location_based_presence_mobile_api_base_url
        API_BASE_URL_DEBUG:
          value: https://thankful-midge-noble.ngrok-free.app/api/mobile
  - name: lelang-fashion-mobile
