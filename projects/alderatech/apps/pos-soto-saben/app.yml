---
name: pos-soto-saben
production: false
enabled: false
repo_owner: AlderaTech
repo: pos-soto-saben
image: ghcr.io/alderatech/pos-soto-saben:latest
stack: laravel
build:
  dockerfile: web/docker/Dockerfile
  workflow: build-and-deploy.yml
app_root: web
env_contract:
  path: web/.env.example
ci:
  variables:
    API_BASE_URL:
      source: vault:vault_pos_soto_saben_mobile_api_base_url
    API_BASE_URL_DEBUG:
      value: https://thankful-midge-noble.ngrok-free.app/api
app_port: 80
env_template: projects/alderatech/apps/pos-soto-saben/.env.j2
networks:
  - nginx_proxy_manager_network
  - mysql_network
volumes:
  - pos_soto_saben_storage:/var/www/storage
env_mount_path: /var/www/.env
run_migrate: true
run_seeder: false
seed_on: fresh
proxy:
  domain: pos-soto-saben.alfian-gading.my.id
  scheme: http
  forward_host: pos-soto-saben
  forward_port: 80
  caching_enabled: true
  websocket_support: false
  cloudflare_flexible: true
dns:
  domain: alfian-gading.my.id
  records:
    - pos-soto-saben
databases:
  mysql:
    - pos_soto_saben
deployment: portfolio
group: alderatech
requires:
  - nginx
  - mysql
database_users:
  - database: pos_soto_saben
    username: '{{ vault_pos_soto_saben_db_username }}'
    password: '{{ vault_pos_soto_saben_db_password }}'
