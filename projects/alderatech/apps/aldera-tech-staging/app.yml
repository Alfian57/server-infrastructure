---
name: aldera-tech-staging
production: false
display_name: Aldera Tech Staging
repo_owner: AlderaTech
repo: aldera-tech
image: ghcr.io/alderatech/aldera-tech:staging
stack: nextjs
build:
  ref: staging
  dockerfile: docker/Dockerfile
  workflow: build-and-deploy.yml
app_port: 3000
env_template: projects/alderatech/apps/aldera-tech-staging/.env.j2
ci:
  variables:
    NEXT_PUBLIC_APP_URL:
      value: https://staging.aldera.tech
    NEXTAUTH_URL:
      value: https://staging.aldera.tech
networks:
  - nginx_proxy_manager_network
  - postgres_network
  - aldera_router_staging_internal
volumes:
  - aldera_staging_uploads:/app/public/uploads
use_prisma: false
run_migrate: false
run_seeder: false
proxy:
  domain: staging.aldera.tech
  scheme: http
  forward_host: aldera-tech-staging
  forward_port: 3000
  caching_enabled: false
  websocket_support: false
  cloudflare_flexible: true
dns:
  domain: aldera.tech
  records:
    - staging
databases:
  postgres:
    - '{{ vault_aldera_staging_db_database | default(''aldera_tech_staging'') }}'
enabled: true
deployment: portfolio
group: alderatech
requires:
  - nginx
  - postgres
database_users:
  - database: '{{ vault_aldera_staging_db_database | default(''aldera_tech_staging'') }}'
    username: '{{ vault_aldera_staging_db_username | default(''aldera_tech_staging'') }}'
    password: '{{ vault_aldera_staging_db_password | default(vault_aldera_db_password) }}'
