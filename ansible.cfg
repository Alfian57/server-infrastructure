[defaults]
inventory = ./inventory/hosts.ini
local_tmp = ./.ansible/tmp
# SECURITY: Set to True in production, False only for initial setup
host_key_checking = True
roles_path = ./roles:./roles/system:./roles/security:./roles/infrastructure:./roles/databases:./roles/applications:./roles/optimization
private_key_file = ~/.ssh/server_ed25519
retry_files_enabled = False
forks = 10
timeout = 30
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts_cache
fact_caching_timeout = 3600
deprecation_warnings = False

[ssh_connection]
# SECURITY: For initial setup use: -o StrictHostKeyChecking=accept-new
# For production: remove or use -o StrictHostKeyChecking=yes
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
control_path_dir = ~/.ansible/cp
control_path = %(directory)s/%%h-%%r

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False
