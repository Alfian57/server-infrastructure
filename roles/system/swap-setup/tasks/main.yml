---
# Create swap space to prevent Out Of Memory (OOM) errors on small VPS

- name: Check if swap is enabled
  ansible.builtin.command: swapon --show
  register: swap_enabled
  changed_when: false

- name: Check if swap file exists
  ansible.builtin.stat:
    path: "{{ swap_file_path }}"
  register: swap_file_check

- name: Create swap file if not exists
  ansible.builtin.command: "fallocate -l {{ swap_size_mb }}M {{ swap_file_path }}"
  when: not swap_file_check.stat.exists

- name: Set permissions on swap file
  ansible.builtin.file:
    path: "{{ swap_file_path }}"
    mode: "0600"
    owner: root
    group: root
  when: not swap_file_check.stat.exists or (swap_enabled.stdout == '')

- name: Format swap file
  ansible.builtin.command: "mkswap {{ swap_file_path }}"
  when: not swap_file_check.stat.exists

- name: Enable swap
  ansible.builtin.command: "swapon {{ swap_file_path }}"
  when: swap_enabled.stdout == ''

- name: Add swap to fstab
  ansible.posix.mount:
    name: none
    src: "{{ swap_file_path }}"
    fstype: swap
    opts: sw
    passno: 0
    dump: 0
    state: present

- name: Configure swappiness (prevent aggressive swapping)
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ swap_swappiness | string }}"
    state: present
    reload: true
    sysctl_file: "{{ swap_sysctl_file }}"
