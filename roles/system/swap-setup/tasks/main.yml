---
# Create swap space to prevent Out Of Memory (OOM) errors on small VPS

- name: Check if swap is enabled
  ansible.builtin.command: swapon --show
  register: swap_enabled
  changed_when: false

- name: Check if swap file exists
  ansible.builtin.stat:
    path: /swapfile
  register: swap_file_check

- name: Create swap file if not exists
  ansible.builtin.command: "fallocate -l {{ swap_size_mb | default(2048) }}M /swapfile"
  when: not swap_file_check.stat.exists

- name: Set permissions on swap file
  ansible.builtin.file:
    path: /swapfile
    mode: "0600"
    owner: root
    group: root
  when: not swap_file_check.stat.exists or (swap_enabled.stdout == '')

- name: Format swap file
  ansible.builtin.command: mkswap /swapfile
  when: not swap_file_check.stat.exists
  
- name: Enable swap
  ansible.builtin.command: swapon /swapfile
  when: swap_enabled.stdout == ''

- name: Add swap to fstab
  ansible.builtin.mount:
    name: none
    src: /swapfile
    fstype: swap
    opts: sw
    passno: 0
    dump: 0
    state: present

- name: Configure swappiness (prevent aggressive swapping)
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "10"
    state: present
    reload: true
    sysctl_file: /etc/sysctl.d/99-swap.conf
