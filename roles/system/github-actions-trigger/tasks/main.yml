---
# GitHub Actions Trigger Role
# Triggers GitHub Actions workflow_dispatch on all configured repositories

- name: Check GitHub CLI is installed
  ansible.builtin.command: which gh
  register: gh_check
  failed_when: false
  changed_when: false

- name: Fail if GitHub CLI not installed
  ansible.builtin.fail:
    msg: "GitHub CLI is not installed. Please run github-cli-setup role first."
  when: gh_check.rc != 0

- name: Check GitHub CLI authentication
  ansible.builtin.command: gh auth status
  register: gh_auth_status
  failed_when: false
  changed_when: false
  become: true
  become_user: deployer

- name: Fail if not authenticated
  ansible.builtin.fail:
    msg: "GitHub CLI is not authenticated. Please run github-cli-setup role first."
  when: gh_auth_status.rc != 0

- name: Display trigger start message
  ansible.builtin.debug:
    msg: |
      ═══════════════════════════════════════════════════════════════════
      ⚡ Triggering GitHub Actions for {{ github_trigger_repos | length }} repositories
      ═══════════════════════════════════════════════════════════════════

- name: Trigger GitHub Actions workflow for each repository
  ansible.builtin.shell: |
    set -o pipefail
    
    # Trigger the workflow
    if gh workflow run "{{ item.workflow }}" -R "{{ item.repo }}" --ref "{{ github_trigger_branch | default('main') }}" 2>&1; then
      echo "SUCCESS: Triggered {{ item.workflow }} for {{ item.repo }}"
    else
      echo "FAILED: Could not trigger workflow for {{ item.repo }}"
      exit 1
    fi
  args:
    executable: /bin/bash
  loop: "{{ github_trigger_repos }}"
  register: trigger_results
  become: true
  become_user: deployer
  failed_when: false
  changed_when: trigger_results.rc == 0

- name: Wait between triggers
  ansible.builtin.pause:
    seconds: "{{ github_trigger_delay | default(5) }}"
  when: not (item == github_trigger_repos | last)
  loop: "{{ github_trigger_repos }}"
  loop_control:
    index_var: idx
  tags:
    - never  # Skip pause by default unless explicitly needed

- name: Display trigger results summary
  ansible.builtin.debug:
    msg: |
      ═══════════════════════════════════════════════════════════════════
      📊 GitHub Actions Trigger Summary
      ═══════════════════════════════════════════════════════════════════
      {% for result in trigger_results.results %}
      {{ '✓' if result.rc == 0 else '✗' }} {{ result.item.repo }}: {{ result.stdout_lines|last if result.stdout_lines else 'Unknown' }}
      {% endfor %}
      ═══════════════════════════════════════════════════════════════════

- name: Display workflow URLs
  ansible.builtin.debug:
    msg: |
      🔗 Check workflow status at:
      {% for repo in github_trigger_repos %}
      - https://github.com/{{ repo.repo }}/actions
      {% endfor %}
