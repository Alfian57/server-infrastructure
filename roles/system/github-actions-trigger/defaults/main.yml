---
# Default values for GitHub Actions Trigger role

# List of repositories to trigger with their workflow files
# Format: { repo: "owner/repo", workflow: "workflow-file.yml" }
github_trigger_repos:
  # Laravel Projects
  - { repo: "alfian57/materi-ku", workflow: "build-and-deploy.yml" }
  - { repo: "alfian57/panca-trivia", workflow: "build-and-deploy.yml" }
  - { repo: "alfian57/posyandu", workflow: "build-and-deploy.yml" }
  - { repo: "alfian57/ruang-istirahat", workflow: "build-and-deploy.yml" }
  - { repo: "alfian57/solvo", workflow: "build-and-deploy.yml" }
  - { repo: "alfian57/tech-talk", workflow: "built-and-deploy.yml" }  # Note: typo in filename
  - { repo: "alfian57/Presensi-Skansaba-Web", workflow: "build-and-deploy.yml" }
  # Go Projects
  - { repo: "alfian57/ruang-tenang-api", workflow: "build-and-deploy.yml" }
  - { repo: "alfian57/campus-project-hub-api", workflow: "docker-build.yml" }
  # Node.js/Next.js Projects
  - { repo: "alfian57/file-pod-api", workflow: "build-and-deploy.yml" }
  - { repo: "alfian57/ruang-tenang-web", workflow: "build-and-deploy.yml" }
  - { repo: "alfian57/personal-portofolio", workflow: "build-and-deploy.yml" }
  - { repo: "alfian57/campus-project-hub-web", workflow: "docker-build.yml" }

# Branch to trigger on
github_trigger_branch: "main"

# Wait between triggers (seconds)
github_trigger_delay: 5
