---
# Users are now configured in bootstrap-ssh.yml
# This role is skipped if no additional users need to be configured

- name: Check if users variable is defined
  ansible.builtin.set_fact:
    users_defined: "{{ users is defined and users is iterable and users | length > 0 }}"

- name: Skip user setup (already configured in bootstrap)
  ansible.builtin.debug:
    msg: "User setup skipped - users already configured via bootstrap-ssh.yml"
  when: not users_defined | default(false)

- name: Ensure required groups exist
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: "{{ users | selectattr('groups', 'defined') | map(attribute='groups') | flatten | unique }}"
  when: 
    - users_defined | default(false)
    - users | selectattr('groups', 'defined') | list | length > 0

- name: Create users with advanced configuration
  ansible.builtin.user:
    name: "{{ item.name }}"
    password: "{{ item.password | default(omit) }}"
    password_lock: "{{ item.password_lock | default(omit) }}"
    comment: "{{ item.comment | default(omit) }}"
    groups: "{{ item.groups | default([]) }}"
    shell: "{{ item.shell | default('/bin/bash') }}"
    createhome: true
    state: "{{ item.state | default('present') }}"
    system: "{{ item.system | default(false) }}"
  loop: "{{ users }}"
  loop_control:
    label: "{{ item.name }}"
  register: users_created
  when: users_defined | default(false)
  no_log: true

- name: Configure SSH directory
  ansible.builtin.file:
    path: "/home/{{ item.name }}/.ssh"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0700"
  loop: "{{ users }}"
  when: 
    - users_defined | default(false)
    - item.ssh_key is defined
    - item.state | default('present') == 'present'
    - not item.system | default(false)
  no_log: true

- name: Add SSH authorized keys
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    key: "{{ item.ssh_key }}"
    state: present
    exclusive: false
  loop: "{{ users }}"
  when: 
    - users_defined | default(false)
    - item.ssh_key is defined
    - item.state | default('present') == 'present'
  no_log: true

- name: Configure passwordless sudo for approved users
  ansible.builtin.lineinfile:
    path: "/etc/sudoers.d/{{ item.name }}"
    line: "{{ item.name }} ALL=(ALL) NOPASSWD: ALL"
    create: true
    mode: "0440"
    validate: "visudo -cf %s"
  loop: "{{ users }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - users_defined | default(false)
    - item.state | default('present') == 'present'
    - item.sudo_nopasswd | default(false) | bool

- name: Remove passwordless sudo for non-approved users
  ansible.builtin.file:
    path: "/etc/sudoers.d/{{ item.name }}"
    state: absent
  loop: "{{ users }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - users_defined | default(false)
    - not (item.sudo_nopasswd | default(false) | bool)

- name: Manage systemd linger for active users
  ansible.builtin.command: >-
    loginctl {{ 'enable-linger' if (item.linger | default(false) | bool) else 'disable-linger' }} {{ item.name }}
  args:
    creates: "{{ ('/var/lib/systemd/linger/' ~ item.name) if (item.linger | default(false) | bool) else omit }}"
    removes: "{{ omit if (item.linger | default(false) | bool) else ('/var/lib/systemd/linger/' ~ item.name) }}"
  loop: "{{ users }}"
  loop_control:
    label: "{{ item.name }} (linger={{ item.linger | default(false) }})"
  when:
    - users_defined | default(false)
    - item.state | default('present') == 'present'
    - item.linger is defined

- name: Disable systemd linger for removed users
  ansible.builtin.command: "loginctl disable-linger {{ item.name }}"
  args:
    removes: "/var/lib/systemd/linger/{{ item.name }}"
  loop: "{{ users }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - users_defined | default(false)
    - item.state | default('present') == 'absent'

- name: Enforce directory isolation permissions on user home directories
  ansible.builtin.file:
    path: "/home/{{ item.name }}"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0700"
  loop: "{{ users }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - users_defined | default(false)
    - item.state | default('present') == 'present'
    - not item.system | default(false)

- name: Enforce directory isolation on application stack directory
  ansible.builtin.file:
    path: "{{ docker_stack_base | default('/opt/docker-stack') }}"
    state: directory
    owner: "{{ deploy_user | default('deployer') }}"
    group: docker
    mode: "0770"
  when: docker_stack_base is defined

# NOTE: Reboot is NOT needed for user changes
# Removed automatic reboot - it was causing unnecessary restarts
# User changes take effect immediately for new sessions
# Only kernel/driver updates require reboot

- name: Check if system reboot is required (unrelated to user changes)
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required_file

- name: Display reboot notice if required
  ansible.builtin.debug:
    msg: "⚠️  System reboot is required (kernel/driver updates). Run 'make reboot' when ready."
  when: reboot_required_file.stat.exists
