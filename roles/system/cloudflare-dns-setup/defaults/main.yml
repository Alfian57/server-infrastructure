---
# Cloudflare DNS configuration defaults

# Domain configuration
cloudflare_domain: "alfian-gading.site"
cloudflare_solvo_domain: "solvo-tech.site"

# DNS records to create/update for alfian-gading.site
cloudflare_dns_records:
  # Root domain - Personal Portfolio
  - name: "@"
    type: "A"
    proxied: true
    comment: "Root domain - Personal Portfolio"

  # ═══════════════════════════════════════════════════════════
  # Laravel Applications
  # ═══════════════════════════════════════════════════════════
  - name: "materi-ku"
    type: "A"
    proxied: true
    comment: "Materi-ku application"

  - name: "panca-trivia"
    type: "A"
    proxied: true
    comment: "Panca-trivia application"

  - name: "ruang-istirahat"
    type: "A"
    proxied: true
    comment: "Ruang-istirahat application"

  - name: "tech-talk"
    type: "A"
    proxied: true
    comment: "Tech-talk application"

  - name: "posyandu"
    type: "A"
    proxied: true
    comment: "Posyandu application"

  - name: "presensi-skansaba-web"
    type: "A"
    proxied: true
    comment: "Presensi Skansaba Web application"

  # ═══════════════════════════════════════════════════════════
  # Go API Applications
  # ═══════════════════════════════════════════════════════════
  - name: "campus-project-hub-api"
    type: "A"
    proxied: true
    comment: "Campus Project Hub API"

  - name: "ruang-tenang-api"
    type: "A"
    proxied: true
    comment: "Ruang Tenang API"

  # ═══════════════════════════════════════════════════════════
  # Next.js Applications
  # ═══════════════════════════════════════════════════════════
  - name: "campus-project-hub-web"
    type: "A"
    proxied: true
    comment: "Campus Project Hub Web"

  - name: "ruang-tenang-web"
    type: "A"
    proxied: true
    comment: "Ruang Tenang Web"

  # ═══════════════════════════════════════════════════════════
  # Node.js/Express Applications
  # ═══════════════════════════════════════════════════════════
  - name: "file-pod-api"
    type: "A"
    proxied: true
    comment: "File Pod API"

  # Wildcard for future apps (DNS only - free plan limitation)
  - name: "*"
    type: "A"
    proxied: false
    comment: "Wildcard for development/testing subdomains"

# DNS records for solvo-tech.site (separate domain)
cloudflare_solvo_dns_records:
  - name: "@"
    type: "A"
    proxied: true
    comment: "Root domain - Solvo application"

# Python packages to install
cloudflare_python_packages:
  - python3-pip
  - python3-cloudflare
