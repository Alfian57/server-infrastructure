---
# Cloudflare DNS configuration defaults

# Domain configuration
cloudflare_domain: "alfian-gading.site"

# DNS records to create/update
cloudflare_dns_records:
  # Root domain (proxied for Cloudflare benefits)
  - name: "@"
    type: "A"
    proxied: true
    comment: "Root domain - Main website"
  
  # Application subdomains (proxied for SSL, DDoS protection, CDN)
  - name: "materi-ku"
    type: "A"
    proxied: true
    comment: "Materi-ku application"
  
  - name: "panca-trivia"
    type: "A"
    proxied: true
    comment: "Panca-trivia application"
  
  - name: "ruang-istirahat"
    type: "A"
    proxied: true
    comment: "Ruang-istirahat application"
  
  - name: "tech-talk"
    type: "A"
    proxied: true
    comment: "Tech-talk application"
  
  # Wildcard for future apps (DNS only - free plan limitation)
  - name: "*"
    type: "A"
    proxied: false
    comment: "Wildcard for development/testing subdomains"

# Python packages to install
cloudflare_python_packages:
  - python3-pip
  - python3-cloudflare
