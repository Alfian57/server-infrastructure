---
# Cloudflare DNS Setup Role
# Installs dependencies and configures Cloudflare DNS management on the server

- name: Install Python pip if not present
  ansible.builtin.apt:
    name: python3-pip
    state: present
    update_cache: true

- name: Install Python Cloudflare library
  ansible.builtin.pip:
    name: cloudflare
    state: present
    executable: pip3

- name: Create deployer scripts directory
  ansible.builtin.file:
    path: /home/deployer/.local/bin
    state: directory
    mode: "0755"
    owner: deployer
    group: deployer

- name: Create Cloudflare config directory
  ansible.builtin.file:
    path: /home/deployer/.config/cloudflare
    state: directory
    mode: "0700"
    owner: deployer
    group: deployer

- name: Copy Cloudflare credentials
  ansible.builtin.template:
    src: cloudflare.ini.j2
    dest: /home/deployer/.config/cloudflare/cloudflare.ini
    mode: "0600"
    owner: deployer
    group: deployer
  no_log: true

- name: Copy DNS configuration
  ansible.builtin.copy:
    content: |
      {{ cloudflare_dns_records | to_nice_yaml }}
    dest: /home/deployer/.config/cloudflare/dns-records.yml
    mode: "0644"
    owner: deployer
    group: deployer

- name: Copy update-cloudflare-dns script
  ansible.builtin.template:
    src: update-cloudflare-dns.py.j2
    dest: /home/deployer/.local/bin/update-cloudflare-dns
    mode: "0755"
    owner: deployer
    group: deployer

- name: Ensure ~/.local/bin is in PATH
  ansible.builtin.lineinfile:
    path: /home/deployer/.bashrc
    line: 'export PATH="$HOME/.local/bin:$PATH"'
    regexp: '^\s*export\s+PATH=.*\.local/bin'
    state: present
    create: true
    owner: deployer
    group: deployer

- name: Display completion message
  ansible.builtin.debug:
    msg: |
      ✓ Cloudflare DNS setup complete on server!
      ✓ Python Cloudflare library installed
      ✓ update-cloudflare-dns script installed to /home/deployer/.local/bin/
      ✓ DNS records configuration saved
      
      To update DNS records, SSH to server and run:
        update-cloudflare-dns
      
      This will create/update {{ cloudflare_dns_records | length }} DNS records for {{ cloudflare_domain }}
