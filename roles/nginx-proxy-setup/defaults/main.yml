---
# Installation directory
npm_install_dir: "/opt/docker-stack/infrastructure/nginx-proxy-manager"

# Admin credentials (from vault)
npm_admin_email: "{{ vault_npm_admin_email }}"
npm_admin_password: "{{ vault_npm_admin_password }}"
npm_admin_nickname: "{{ vault_npm_admin_nickname }}"

# Domain configuration (from vault)
npm_domain_name: "{{ vault_npm_domain_name }}"

# Cloudflare DNS settings (from vault)
cloudflare_email: "{{ vault_cloudflare_email }}"
cloudflare_api_token: "{{ vault_cloudflare_api_token }}"

# Docker image version
npm_image_version: "2.12.3"

# Example proxy hosts configuration
# Each proxy host will automatically get:
# - Let's Encrypt SSL certificate
# - Force SSL (HTTP → HTTPS redirect)
# - HTTP/2 support
# - HSTS security header
# - Block exploits protection
proxy_hosts:
  - subdomain: "materi-ku"
    scheme: "http"
    forward_host: "materi-ku"
    forward_port: 80
    caching_enabled: true
    websocket_support: false
  
  - subdomain: "panca-trivia"
    scheme: "http"
    forward_host: "panca-trivia"
    forward_port: 80
    caching_enabled: true
    websocket_support: false
  
  - subdomain: "ruang-istirahat"
    scheme: "http"
    forward_host: "ruang-istirahat"
    forward_port: 80
    caching_enabled: true
    websocket_support: false
  
  - subdomain: "tech-talk"
    scheme: "http"
    forward_host: "tech-talk"
    forward_port: 80
    caching_enabled: true
    websocket_support: false
