---
# Redis Role Defaults

# Path configuration
docker_stack_base: "/opt/docker-stack"
docker_stack_databases: "{{ docker_stack_base }}/databases"

# Docker image selection. host-profile sets redis_auto_image on new hosts.
redis_preserve_existing_engine: true
redis_image_override: ""
redis_auto_image: "redis:8"

# Network configuration
redis_network: "redis_network"

# Resource limits
redis_memory_limit: "512M"
redis_memory_reservation: "256M"

# Custom config
redis_custom_config: false

# Redis Commander settings
redis_enable_commander: true
redis_commander_version: "latest"
redis_commander_port: "8083"
