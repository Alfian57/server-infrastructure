---
- name: Validate required variables
  ansible.builtin.assert:
    that:
      - vault_postgres_password is defined
      - vault_postgres_password | length >= 16
    fail_msg: "vault_postgres_password must be defined and at least 16 characters"
    quiet: true

- name: Create postgres directory
  ansible.builtin.file:
    path: "{{ docker_stack_databases }}/postgres"
    state: directory
    mode: "0750"
    owner: root
    group: root

- name: Copy postgres docker-compose.yml
  ansible.builtin.template:
    src: "docker-compose.yml.j2"
    dest: "{{ docker_stack_databases }}/postgres/docker-compose.yml"
    mode: "0640"
    owner: root
    group: root
  register: postgres_compose_changed

- name: Generate .env from vault credentials
  ansible.builtin.template:
    src: ".env.j2"
    dest: "{{ docker_stack_databases }}/postgres/.env"
    mode: "0600"
    owner: root
    group: root
  no_log: true
  register: postgres_env_changed

- name: Deploy PostgreSQL container
  community.docker.docker_compose_v2:
    project_src: "{{ docker_stack_databases }}/postgres"
    env_files: "{{ docker_stack_databases }}/postgres/.env"
    state: present
    pull: "{{ 'always' if postgres_compose_changed.changed else 'policy' }}"
  register: postgres_container

- name: Wait for PostgreSQL container to be healthy
  community.docker.docker_container_info:
    name: postgres-db
  register: container_info
  until: >
    container_info.container.State.Health.Status is defined and
    (container_info.container.State.Health.Status == "healthy" or
     container_info.container.State.Health.Status == "starting")
  retries: 12
  delay: 10

- name: Create application databases
  ansible.builtin.command:
    cmd: >-
      docker exec postgres-db psql -U root -d postgres
      -c "SELECT 'CREATE DATABASE {{ item }}' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ item }}')\gexec"
  loop: "{{ postgres_databases | default([]) }}"
  register: db_creation
  changed_when: "'CREATE DATABASE' in db_creation.stdout"
  failed_when: false
