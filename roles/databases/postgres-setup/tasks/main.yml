---
- name: Validate required variables
  ansible.builtin.assert:
    that:
      - vault_postgres_password is defined
      - vault_postgres_password | length >= 16
    fail_msg: "vault_postgres_password must be defined and at least 16 characters"
    quiet: true

- name: Inspect existing PostgreSQL container
  community.docker.docker_container_info:
    name: postgres-db
  register: postgres_existing_container
  failed_when: false

- name: Select effective PostgreSQL image
  ansible.builtin.set_fact:
    postgres_existing_image: "{{ postgres_existing_container.container.Config.Image | default('') }}"
    postgres_effective_image: >-
      {{
        postgres_image_override
        if postgres_image_override | default('') | length > 0
        else (
          postgres_existing_container.container.Config.Image
          if postgres_preserve_existing_engine | bool
          and postgres_existing_container.exists | default(false)
          and postgres_existing_container.container.Config.Image | default('') | length > 0
          else postgres_auto_image | default('postgres:18-bookworm')
        )
      }}

- name: Display PostgreSQL image selection
  ansible.builtin.debug:
    msg:
      - "Requested auto image: {{ postgres_auto_image | default('unset') }}"
      - "Existing image: {{ postgres_existing_image | default('none') }}"
      - "Effective image: {{ postgres_effective_image }}"

- name: Set PostgreSQL admin connection facts
  ansible.builtin.set_fact:
    postgres_admin_user: "{{ vault_postgres_user }}"

- name: Create postgres directory
  ansible.builtin.file:
    path: "{{ docker_stack_databases }}/postgres"
    state: directory
    mode: "0750"
    owner: root
    group: root

- name: Copy postgres docker-compose.yml
  ansible.builtin.template:
    src: "docker-compose.yml.j2"
    dest: "{{ docker_stack_databases }}/postgres/docker-compose.yml"
    mode: "0640"
    owner: root
    group: root
  register: postgres_compose_changed

- name: Generate .env from vault credentials
  ansible.builtin.template:
    src: ".env.j2"
    dest: "{{ docker_stack_databases }}/postgres/.env"
    mode: "0600"
    owner: root
    group: root
  no_log: true
  register: postgres_env_changed

- name: Deploy PostgreSQL container
  community.docker.docker_compose_v2:
    project_src: "{{ docker_stack_databases }}/postgres"
    env_files: "{{ docker_stack_databases }}/postgres/.env"
    state: present
    pull: "{{ 'always' if postgres_compose_changed.changed else 'policy' }}"
  when: not (ansible_check_mode and (postgres_compose_changed.changed or postgres_env_changed.changed))
  register: postgres_container

- name: Wait for PostgreSQL container to be healthy
  community.docker.docker_container_info:
    name: postgres-db
  register: container_info
  until: >
    container_info.container.State.Health.Status is defined and
    container_info.container.State.Health.Status == "healthy"
  retries: 12
  delay: 10

- name: Create application databases
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -i
      - -e
      - "PGPASSWORD={{ vault_postgres_password }}"
      - postgres-db
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -U
      - "{{ postgres_admin_user }}"
      - -d
      - postgres
    stdin: |
      SELECT format('CREATE DATABASE %I', '{{ item | replace("'", "''") }}')
      WHERE NOT EXISTS (
        SELECT FROM pg_database WHERE datname = '{{ item | replace("'", "''") }}'
      ) \gexec
  loop: "{{ postgres_databases | default([]) }}"
  register: db_creation
  changed_when: "'CREATE DATABASE' in (db_creation.stdout | default(''))"
  failed_when: db_creation.rc != 0
  no_log: true
