---
- name: Validate required variables
  ansible.builtin.assert:
    that:
      - vault_mysql_root_password is defined
      - vault_mysql_root_password | length >= 16
    fail_msg: "vault_mysql_root_password must be defined and at least 16 characters"
    quiet: true

- name: Inspect existing MySQL/MariaDB container
  community.docker.docker_container_info:
    name: mysql-db
  register: mysql_existing_container
  failed_when: false

- name: Select effective MySQL-compatible image
  ansible.builtin.set_fact:
    mysql_existing_image: "{{ mysql_existing_container.container.Config.Image | default('') }}"
    mysql_effective_image: >-
      {{
        mysql_image_override
        if mysql_image_override | default('') | length > 0
        else (
          mysql_existing_container.container.Config.Image
          if mysql_preserve_existing_engine | bool
          and mysql_existing_container.exists | default(false)
          and mysql_existing_container.container.Config.Image | default('') | length > 0
          else mysql_auto_image | default('mariadb:10.11')
        )
      }}

- name: Select MySQL-compatible client binaries
  ansible.builtin.set_fact:
    mysql_is_mariadb: "{{ 'mariadb' in (mysql_effective_image | lower) }}"
    mysql_client_binary: "{{ 'mariadb' if 'mariadb' in (mysql_effective_image | lower) else 'mysql' }}"
    mysql_admin_binary: "{{ 'mariadb-admin' if 'mariadb' in (mysql_effective_image | lower) else 'mysqladmin' }}"

- name: Display MySQL-compatible engine selection
  ansible.builtin.debug:
    msg:
      - "Requested auto image: {{ mysql_auto_image | default('unset') }}"
      - "Existing image: {{ mysql_existing_image | default('none') }}"
      - "Effective image: {{ mysql_effective_image }}"
      - "Client binary: {{ mysql_client_binary }}"

- name: Create mysql directory
  ansible.builtin.file:
    path: "{{ docker_stack_databases }}/mysql"
    state: directory
    mode: "0750"
    owner: root
    group: root

- name: Copy mysql docker-compose.yml
  ansible.builtin.template:
    src: "docker-compose.yml.j2"
    dest: "{{ docker_stack_databases }}/mysql/docker-compose.yml"
    mode: "0640"
    owner: root
    group: root
  register: mysql_compose_changed

- name: Generate .env from vault credentials
  ansible.builtin.template:
    src: ".env.j2"
    dest: "{{ docker_stack_databases }}/mysql/.env"
    mode: "0600"
    owner: root
    group: root
  no_log: true
  register: mysql_env_changed

- name: Deploy MySQL container
  community.docker.docker_compose_v2:
    project_src: "{{ docker_stack_databases }}/mysql"
    env_files: "{{ docker_stack_databases }}/mysql/.env"
    state: present
    pull: "{{ 'always' if mysql_compose_changed.changed else 'policy' }}"
  when: not (ansible_check_mode and (mysql_compose_changed.changed or mysql_env_changed.changed))
  register: mysql_container

- name: Wait for MySQL container to be healthy
  community.docker.docker_container_info:
    name: mysql-db
  register: container_info
  until: >
    container_info.container.State.Health.Status is defined and
    container_info.container.State.Health.Status == "healthy"
  retries: 12
  delay: 10

- name: Create application databases
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -i
      - -e
      - "MYSQL_PWD={{ vault_mysql_root_password }}"
      - mysql-db
      - "{{ mysql_client_binary }}"
      - -u
      - root
    stdin: >-
      CREATE DATABASE IF NOT EXISTS `{{ item | replace('`', '``') }}`
      CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
  loop: "{{ mysql_databases | default([]) }}"
  register: db_creation
  changed_when: db_creation.rc == 0
  failed_when: db_creation.rc != 0
  no_log: true

- name: Create application database users
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -i
      - -e
      - "MYSQL_PWD={{ vault_mysql_root_password }}"
      - mysql-db
      - "{{ mysql_client_binary }}"
      - -u
      - root
    stdin: |
      CREATE USER IF NOT EXISTS '{{ item.username | replace("'", "''") }}'@'%' IDENTIFIED BY '{{ item.password | replace("'", "''") }}';
      ALTER USER '{{ item.username | replace("'", "''") }}'@'%' IDENTIFIED BY '{{ item.password | replace("'", "''") }}';
      GRANT ALL PRIVILEGES ON `{{ item.database | replace('`', '``') }}`.* TO '{{ item.username | replace("'", "''") }}'@'%';
      FLUSH PRIVILEGES;
  loop: "{{ mysql_database_users | default([]) }}"
  register: db_user_creation
  changed_when: db_user_creation.rc == 0
  failed_when: db_user_creation.rc != 0
  no_log: true
