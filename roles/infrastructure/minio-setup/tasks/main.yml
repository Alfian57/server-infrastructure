---
- name: Inspect existing MinIO container
  community.docker.docker_container_info:
    name: minio
  register: minio_existing_container
  failed_when: false

- name: Select requested MinIO image
  ansible.builtin.set_fact:
    minio_requested_image: "{{ minio_image_override if minio_image_override | default('') | length > 0 else (minio_image | default('minio/minio:latest')) }}"
    minio_existing_image: "{{ minio_existing_container.container.Config.Image | default('') }}"

- name: Decide whether to preserve existing MinIO image
  ansible.builtin.set_fact:
    minio_should_preserve_existing_image: >-
      {{
        minio_preserve_existing_image | bool
        and minio_existing_container.exists | default(false)
        and minio_existing_image | default('') | length > 0
        and not (minio_image_override | default('') | length > 0)
      }}

- name: Select effective MinIO image
  ansible.builtin.set_fact:
    minio_effective_image: >-
      {{
        minio_existing_image
        if minio_should_preserve_existing_image | bool
        else minio_requested_image
      }}

- name: Display MinIO image selection
  ansible.builtin.debug:
    msg:
      - "Requested auto image: {{ minio_requested_image }}"
      - "Existing image: {{ minio_existing_image | default('none') }}"
      - "Preserve existing image: {{ minio_should_preserve_existing_image | bool }}"
      - "Effective image: {{ minio_effective_image }}"

- name: Create MinIO directory
  ansible.builtin.file:
    path: /opt/docker-stack/infrastructure/minio
    state: directory
    mode: "0755"
    owner: "{{ ansible_user | default('root') }}"
    group: "{{ ansible_user | default('root') }}"

- name: Create MinIO data directory
  ansible.builtin.file:
    path: /opt/docker-stack/infrastructure/minio/data
    state: directory
    mode: "0755"
    owner: "{{ ansible_user | default('root') }}"
    group: "{{ ansible_user | default('root') }}"

- name: Copy MinIO docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/docker-stack/infrastructure/minio/docker-compose.yml
    mode: "0644"
    owner: "{{ ansible_user | default('root') }}"
    group: "{{ ansible_user | default('root') }}"
  register: minio_compose_file

- name: Copy MinIO .env file
  ansible.builtin.template:
    src: .env.j2
    dest: /opt/docker-stack/infrastructure/minio/.env
    mode: "0600"
    owner: "{{ ansible_user | default('root') }}"
    group: "{{ ansible_user | default('root') }}"

- name: Ensure MinIO network exists
  community.docker.docker_network:
    name: minio_network
    state: present

- name: Deploy MinIO container
  community.docker.docker_compose_v2:
    project_src: /opt/docker-stack/infrastructure/minio
    pull: "{{ 'always' if minio_compose_file.changed else 'policy' }}"
    state: present
  register: minio_deployment

- name: Wait for MinIO to be ready
  block:
    - name: Poll MinIO health endpoint
      ansible.builtin.uri:
        url: "http://localhost:9000/minio/health/live"
        method: GET
        status_code: [200]
        timeout: 10
      register: minio_health
      retries: 30
      delay: 5
      until: minio_health.status == 200
  rescue:
    - name: Capture MinIO container status
      community.docker.docker_container_info:
        name: minio
      register: minio_failed_container_info
      failed_when: false

    - name: Capture MinIO logs
      ansible.builtin.command:
        argv:
          - docker
          - logs
          - --tail
          - "80"
          - minio
      register: minio_failed_logs
      changed_when: false
      failed_when: false

    - name: Fail with MinIO diagnostics
      ansible.builtin.fail:
        msg: |-
          MinIO did not become ready on http://localhost:9000/minio/health/live.
          Requested image: {{ minio_requested_image }}
          Effective image: {{ minio_effective_image }}
          Container state: {{ minio_failed_container_info.container.State.Status | default('missing') }}
          Exit code: {{ minio_failed_container_info.container.State.ExitCode | default('n/a') }}
          Recent logs:
          {{ (minio_failed_logs.stdout | default('no logs captured'))[-3000:] }}

- name: Display MinIO deployment status
  ansible.builtin.debug:
    msg:
      - "═══════════════════════════════════════════════════════════"
      - "  ✓ MinIO Deployed Successfully"
      - "═══════════════════════════════════════════════════════════"
      - ""
      - "  Console URL: http://{{ ansible_default_ipv4.address }}:9001"
      - "  API URL: http://{{ ansible_default_ipv4.address }}:9000"
      - "  Internal: minio:9000 (from docker network)"
      - ""
      - "═══════════════════════════════════════════════════════════"

# ═══════════════════════════════════════════════════════════
# MINIO CLIENT (mc) INSTALLATION
# ═══════════════════════════════════════════════════════════

- name: Download MinIO client (mc)
  ansible.builtin.get_url:
    url: "{{ minio_client_url }}"
    dest: /usr/local/bin/mc
    mode: "0755"
    owner: root
    group: root

- name: Verify MinIO client installation
  ansible.builtin.command: mc --version
  register: mc_version
  changed_when: false

- name: Display MinIO client version
  ansible.builtin.debug:
    msg: "{{ mc_version.stdout_lines }}"

# ═══════════════════════════════════════════════════════════
# CONFIGURE MC ALIAS
# ═══════════════════════════════════════════════════════════

- name: Configure mc alias for local MinIO
  ansible.builtin.command: >
    mc alias set local
    http://localhost:9000
    {{ minio_root_user }}
    {{ minio_root_password }}
  changed_when: true
  no_log: true

# ═══════════════════════════════════════════════════════════
# BUCKET CREATION
# ═══════════════════════════════════════════════════════════

- name: Check existing buckets
  ansible.builtin.command: mc ls local/
  register: existing_buckets
  changed_when: false
  failed_when: false

- name: Create MinIO buckets
  ansible.builtin.command: "mc mb local/{{ item.name }} --ignore-existing"
  loop: "{{ minio_buckets }}"
  when: minio_buckets is defined and minio_buckets | length > 0
  changed_when: true

- name: Set bucket policies
  ansible.builtin.command: "mc anonymous set {{ item.policy | default('private') }} local/{{ item.name }}"
  loop: "{{ minio_buckets }}"
  when:
    - minio_buckets is defined
    - minio_buckets | length > 0
    - item.policy is defined
    - item.policy != 'private'
  changed_when: true

- name: List created buckets
  ansible.builtin.command: mc ls local/
  register: final_buckets
  changed_when: false

- name: Display bucket creation status
  ansible.builtin.debug:
    msg:
      - "═══════════════════════════════════════════════════════════"
      - "  ✓ MinIO Buckets Created"
      - "═══════════════════════════════════════════════════════════"
      - ""
      - "{{ final_buckets.stdout_lines }}"
      - ""
      - "═══════════════════════════════════════════════════════════"
