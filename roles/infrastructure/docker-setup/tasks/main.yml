---
- name: Check if Docker installation is requested
  ansible.builtin.debug:
    msg: "Docker installation is {{ 'enabled' if docker_install else 'disabled' }}"

- name: End play for this role if Docker installation is disabled
  ansible.builtin.meta: end_play
  when: not docker_install | bool

- name: Ensure old versions of Docker are removed
  ansible.builtin.package:
    name:
      - docker
      - docker-engine
      - docker.io
      - containerd
      - runc
    state: absent

- name: Install required system packages for Docker
  ansible.builtin.package:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - apt-transport-https
    state: present

- name: Create directory for Docker GPG key
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker's official GPG key (modern method)
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Get system architecture
  ansible.builtin.command: dpkg --print-architecture
  register: dpkg_architecture
  changed_when: false
  check_mode: false

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ dpkg_architecture.stdout }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Install Docker Engine
  ansible.builtin.package:
    name:
      - docker-{{ docker_edition }}
      - docker-{{ docker_edition }}-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: "{{ docker_package_state }}"
    update_cache: true

- name: Ensure Docker service is started and enabled
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Add users to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
  when: docker_users | length > 0
  register: docker_group_added

- name: Configure Docker daemon
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_config | to_nice_json }}"
    mode: "0644"
    owner: "root"
    group: "root"
  vars:
    docker_daemon_config:
      log-driver: "json-file"
      log-opts:
        max-size: "10m"
        max-file: "3"
      storage-driver: "overlay2"
      live-restore: true
  notify: Restart Docker

- name: Flush handlers to restart Docker if needed
  ansible.builtin.meta: flush_handlers

- name: Verify Docker installation
  ansible.builtin.command: docker --version
  changed_when: false
  register: docker_version

- name: Display Docker version
  ansible.builtin.debug:
    var: docker_version.stdout

- name: Verify Docker Compose installation
  ansible.builtin.command: docker compose version
  changed_when: false
  register: docker_compose_version

- name: Display Docker Compose version
  ansible.builtin.debug:
    var: docker_compose_version.stdout

- name: Create directory for docker-stack
  ansible.builtin.file:
    path: "/opt/docker-stack"
    state: directory
    mode: "0755"
    owner: "{{ ansible_user | default('root') }}"
    group: "{{ ansible_user | default('root') }}"

- name: Copy docker-password.txt file to server
  ansible.builtin.template:
    src: docker-password.txt.j2
    dest: "/opt/docker-stack/docker-password.txt"
    mode: "0600"  # Changed from 0755 to 0600 for security
    owner: "{{ ansible_user | default('root') }}"
    group: "{{ ansible_user | default('root') }}"

- name: Notify users to re-login if added to docker group
  ansible.builtin.debug:
    msg: "Users {{ docker_users | join(', ') }} have been added to the docker group. They need to log out and back in for changes to take effect."
  when: 
    - docker_group_added is defined
    - docker_group_added.changed
