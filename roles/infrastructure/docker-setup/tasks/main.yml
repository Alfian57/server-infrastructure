---
# Docker Setup Role - Install and configure Docker Engine
# Uses block to conditionally skip all tasks if docker_install is false

- name: Check if Docker installation is requested
  ansible.builtin.debug:
    msg: "Docker installation is {{ 'enabled' if docker_install else 'disabled' }}"

- name: Validate Docker-supported OS family
  ansible.builtin.assert:
    that:
      - ansible_os_family in docker_supported_os_families
    fail_msg: "Docker setup currently supports Debian/Ubuntu and RedHat-family hosts, got {{ ansible_os_family }}."
    quiet: true
  when: docker_install | bool

- name: Docker installation tasks
  when: docker_install | bool
  block:
    - name: Ensure old versions of Docker are removed
      ansible.builtin.package:
        name:
          - docker
          - docker-engine
          - docker.io
          - containerd
          - runc
        state: absent

    - name: Install required Debian packages for Docker
      ansible.builtin.package:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - apt-transport-https
        state: present
      when: ansible_os_family == 'Debian'

    - name: Install required RedHat packages for Docker
      ansible.builtin.package:
        name:
          - ca-certificates
          - curl
          - gnupg2
          - yum-utils
        state: present
      when: ansible_os_family == 'RedHat'

    - name: Create directory for Docker GPG key on Debian
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
      when: ansible_os_family == 'Debian'

    - name: Add Docker's official Debian/Ubuntu GPG key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ docker_apt_distribution }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
      when: ansible_os_family == 'Debian'

    - name: Get Debian package architecture
      ansible.builtin.command: dpkg --print-architecture
      register: dpkg_architecture
      changed_when: false
      check_mode: false
      when: ansible_os_family == 'Debian'

    - name: Add Docker Debian/Ubuntu repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ dpkg_architecture.stdout }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ docker_apt_distribution }} {{ docker_apt_codename }} stable"
        state: present
        filename: docker
      when: ansible_os_family == 'Debian'

    - name: Add Docker RedHat repository
      ansible.builtin.yum_repository:
        name: docker-ce-stable
        description: Docker CE Stable - $basearch
        baseurl: "https://download.docker.com/linux/centos/$releasever/$basearch/stable"
        enabled: true
        gpgcheck: true
        gpgkey: https://download.docker.com/linux/centos/gpg
      when: ansible_os_family == 'RedHat'

    - name: Install Docker Engine
      ansible.builtin.package:
        name:
          - docker-{{ docker_edition }}
          - docker-{{ docker_edition }}-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: "{{ docker_package_state }}"
        update_cache: true

    - name: Ensure Docker service is started and enabled
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Add users to docker group
      ansible.builtin.user:
        name: "{{ item }}"
        groups: docker
        append: true
      loop: "{{ docker_users }}"
      when: docker_users | length > 0
      register: docker_group_added

    - name: Configure Docker daemon
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: "{{ docker_daemon_config | to_nice_json }}"
        mode: "0644"
        owner: "root"
        group: "root"
      vars:
        docker_daemon_config:
          log-driver: "json-file"
          log-opts:
            max-size: "10m"
            max-file: "3"
          storage-driver: "overlay2"
          live-restore: true
      notify: Restart Docker
      when: not (setup_security | default(false) | bool)

    - name: Flush handlers to restart Docker if needed
      ansible.builtin.meta: flush_handlers

    - name: Verify Docker installation
      ansible.builtin.command: docker --version
      changed_when: false
      register: docker_version

    - name: Display Docker version
      ansible.builtin.debug:
        var: docker_version.stdout

    - name: Verify Docker Compose installation
      ansible.builtin.command: docker compose version
      changed_when: false
      register: docker_compose_version

    - name: Display Docker Compose version
      ansible.builtin.debug:
        var: docker_compose_version.stdout

    - name: Create directory for docker-stack
      ansible.builtin.file:
        path: "/opt/docker-stack"
        state: directory
        mode: "0750"
        owner: "{{ deploy_user | default(ansible_user | default('root')) }}"
        group: "docker"

    - name: Copy docker-password.txt file to server
      ansible.builtin.template:
        src: docker-password.txt.j2
        dest: "/opt/docker-stack/docker-password.txt"
        mode: "0640"
        owner: "{{ deploy_user | default(ansible_user | default('root')) }}"
        group: "docker"
      no_log: true

    - name: Notify users to re-login if added to docker group
      ansible.builtin.debug:
        msg: "Users {{ docker_users | join(', ') }} have been added to the docker group. They need to log out and back in for changes to take effect."
      when:
        - docker_group_added is defined
        - docker_group_added.changed
