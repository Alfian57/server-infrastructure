---
- name: Create autoheal directory
  ansible.builtin.file:
    path: "{{ docker_stack_infrastructure }}/autoheal"
    state: directory
    mode: "0750"
    owner: root
    group: root

- name: Copy autoheal docker-compose.yml
  ansible.builtin.template:
    src: "docker-compose.yml.j2"
    dest: "{{ docker_stack_infrastructure }}/autoheal/docker-compose.yml"
    mode: "0640"
    owner: root
    group: root
  register: autoheal_compose_changed

- name: Deploy autoheal container
  community.docker.docker_compose_v2:
    project_src: "{{ docker_stack_infrastructure }}/autoheal"
    state: present
    pull: "{{ 'always' if autoheal_compose_changed.changed else 'policy' }}"
  register: autoheal_container

- name: Verify autoheal container is running
  community.docker.docker_container_info:
    name: autoheal
  register: autoheal_info
  failed_when: not autoheal_info.container.State.Running
