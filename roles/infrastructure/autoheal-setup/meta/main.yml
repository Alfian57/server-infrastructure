galaxy_info:
  author: "Alfian"
  description: "Deploys Docker Autoheal to automatically restart unhealthy containers"
  company: ""
  license: "MIT"
  min_ansible_version: "2.12"
  platforms:
    - name: Ubuntu
      versions:
        - focal
        - jammy
        - noble
    - name: Debian
      versions:
        - bullseye
        - bookworm
  galaxy_tags:
    - infrastructure
    - docker
    - monitoring
    - autoheal

dependencies:
  - role: docker-setup

# Required collections
collections:
  - community.docker
