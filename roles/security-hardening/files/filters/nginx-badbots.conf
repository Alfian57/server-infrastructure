# Fail2ban filter for bad bots
# /etc/fail2ban/filter.d/nginx-badbots.conf

[Definition]
badbots = User-Agent: .*GoogleHack|Acunetix|Arachni|Aircrack|brutus|brute|.*burp|DirBuster|emailreaper|Grabber|hacker|HTTrack|Havij|Injection|Loader|masscan|Metasploit|Nikto|Nmap|Nessus|NucleiScanner|Nuclei|Paros|Proxy|python-requests|sqlmap|storm-breaker|webinspect|whisker|ZAP|w3af|WPScan|WPScan|Wfuzz|Hydra|John the Ripper|slowhttptest|THC

failregex = ^<HOST> -.*"(GET|POST|HEAD).*HTTP.*".*(<badbots>)

ignoreregex =
