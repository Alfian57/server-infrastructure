---
# Handlers for Security Hardening

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted

- name: Restart sshd
  ansible.builtin.systemd:
    name: sshd
    state: restarted

- name: Restart docker
  ansible.builtin.systemd:
    name: docker
    state: restarted

- name: Reload apparmor
  ansible.builtin.command: /etc/init.d/apparmor reload
  changed_when: true

- name: Restart auditd
  ansible.builtin.command: service auditd restart
  changed_when: true
