---
# Shared tasks for deploying Express.js applications from GitHub Container Registry
#
# Required variables:
#   - app_name: Name of the application
#   - github_username: GitHub username for GHCR authentication
#   - github_token: GitHub personal access token
#
# Optional variables:
#   - docker_networks: List of Docker networks to connect to (default: ['nginx_proxy_manager_network'])
#   - app_port: Internal port the app runs on (default: 3000)
#   - node_env: Node environment (default: 'production')
#   - requires_database: Whether app needs database (default: false)

- name: Set application variables
  ansible.builtin.set_fact:
    app_install_dir: "/opt/docker-stack/applications/{{ app_name }}"
    app_image: "ghcr.io/{{ github_username }}/{{ app_name }}:latest"
    app_port: "{{ app_port | default(3000) }}"
    node_env: "{{ node_env | default('production') }}"
    requires_database: "{{ requires_database | default(false) }}"

- name: Set default networks (with database if required)
  ansible.builtin.set_fact:
    app_networks: "{{ docker_networks | default(['nginx_proxy_manager_network'] + (['mysql_network'] if requires_database else [])) }}"

- name: Create directory for {{ app_name }} application
  ansible.builtin.file:
    path: "{{ app_install_dir }}"
    state: directory
    mode: "0755"
    owner: "{{ ansible_user | default('root') }}"
    group: "{{ ansible_user | default('root') }}"

- name: Create log directory for update scripts
  ansible.builtin.file:
    path: "/var/log/docker-updates"
    state: directory
    mode: "0775"
    owner: "deployer"
    group: "deployer"

- name: Create uploads directory (if needed)
  ansible.builtin.file:
    path: "{{ app_install_dir }}/uploads"
    state: directory
    mode: "0755"
    owner: "{{ ansible_user | default('root') }}"
    group: "{{ ansible_user | default('root') }}"
  when: create_uploads_dir | default(false)

- name: Log in to GitHub Container Registry
  community.docker.docker_login:
    registry_url: ghcr.io
    username: "{{ github_username }}"
    password: "{{ github_token }}"
    reauthorize: true
  no_log: true

- name: Validate GHCR access - check image exists
  ansible.builtin.command: "docker manifest inspect {{ app_image }}"
  register: ghcr_access_check
  failed_when: ghcr_access_check.rc != 0
  changed_when: false

- name: Copy update.sh file to server
  ansible.builtin.copy:
    src: ../../common/files/update.sh
    dest: "{{ app_install_dir }}/update.sh"
    mode: "0755"
    owner: "deployer"
    group: "deployer"

- name: Check if docker-compose.yml.j2 template exists
  ansible.builtin.stat:
    path: "{{ role_path }}/templates/docker-compose.yml.j2"
  delegate_to: localhost
  become: false
  register: compose_template_check

- name: Copy docker-compose file to server (static)
  ansible.builtin.copy:
    src: docker-compose.yml
    dest: "{{ app_install_dir }}/docker-compose.yml"
    mode: "0644"
    owner: "{{ ansible_user | default('root') }}"
    group: "{{ ansible_user | default('root') }}"
  when: not compose_template_check.stat.exists | default(true)

- name: Generate docker-compose from template
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ app_install_dir }}/docker-compose.yml"
    mode: "0644"
    owner: "{{ ansible_user | default('root') }}"
    group: "{{ ansible_user | default('root') }}"
  when: compose_template_check.stat.exists | default(false)

- name: Generate .env from vault credentials
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ app_install_dir }}/.env"
    mode: "0640"
    owner: "{{ ansible_user | default('root') }}"
    group: "docker"

- name: Pull latest Docker image
  community.docker.docker_image:
    name: "{{ app_image }}"
    source: pull
    force_source: true
    state: present

- name: Ensure external networks exist
  community.docker.docker_network:
    name: "{{ item }}"
    state: present
  loop: "{{ app_networks }}"

- name: Ensure Docker Compose is installed
  ansible.builtin.apt:
    name: docker-compose-plugin
    state: present

- name: Deploy {{ app_name }} container with docker-compose
  community.docker.docker_compose_v2:
    project_src: "{{ app_install_dir }}"
    pull: always
    remove_orphans: true
    recreate: auto
    state: present
  register: app_deployment

- name: Wait for Express app to start
  ansible.builtin.pause:
    seconds: 10

- name: Check if container is running
  community.docker.docker_container_info:
    name: "{{ app_name }}"
  register: container_info
  retries: 5
  delay: 5
  until: 
    - container_info.container is defined
    - container_info.container.State is defined
    - container_info.container.State.Running | bool

- name: Run Prisma migrations (if using Prisma)
  ansible.builtin.command:
    cmd: docker exec {{ app_name }} npx prisma migrate deploy
  register: prisma_migration_result
  when: 
    - container_info.container.State.Running | bool
    - use_prisma | default(false) | bool
  failed_when: false

- name: Display Prisma migration result
  ansible.builtin.debug:
    msg: "Prisma migration result: {{ prisma_migration_result.stdout | default('No output') }}"
  when: prisma_migration_result is defined and prisma_migration_result.stdout is defined

- name: Verify API health endpoint
  ansible.builtin.uri:
    url: "http://localhost:{{ app_port }}{{ health_endpoint | default('/health') }}"
    method: GET
    status_code: [200, 204]
    timeout: 10
  register: app_health
  retries: 10
  delay: 5
  failed_when: false
  when: verify_health | default(true)

- name: Display deployment status
  ansible.builtin.debug:
    msg: "{{ app_name }} Express API deployment {{ 'successful and responding' if app_health.status is defined and app_health.status in [200, 204] else 'completed (container running)' }}"
