---
# UFW Firewall Configuration
# Block all incoming traffic by default, allow specific ports

- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: Reset UFW to default
  community.general.ufw:
    state: reset
  when: security_ufw_reset | default(false)

- name: Set UFW default incoming policy to deny
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set UFW default outgoing policy to allow
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Set UFW default routed policy to deny
  community.general.ufw:
    direction: routed
    policy: deny

# SSH Access (Priority: ALWAYS allow port 22 first to prevent lockout)
- name: Always allow SSH on port 22 (prevent lockout)
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    comment: "SSH access (always enabled)"

- name: Allow SSH on custom port if different from 22
  community.general.ufw:
    rule: allow
    port: "{{ security_ssh_port }}"
    proto: tcp
    comment: "SSH access (custom port)"
  when: security_ssh_port | int != 22

# Rate limit SSH to prevent brute force
- name: Rate limit SSH connections on port 22
  community.general.ufw:
    rule: limit
    port: "22"
    proto: tcp
    comment: "SSH rate limiting"

- name: Rate limit SSH on custom port
  community.general.ufw:
    rule: limit
    port: "{{ security_ssh_port }}"
    proto: tcp
    comment: "SSH rate limiting (custom port)"
  when: security_ssh_port | int != 22

# Web Traffic
- name: Allow HTTP (80)
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp
    comment: "HTTP traffic"

- name: Allow HTTPS (443)
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp
    comment: "HTTPS traffic"

# Nginx Proxy Manager Dashboard
- name: Allow NPM dashboard (81)
  community.general.ufw:
    rule: allow
    port: "81"
    proto: tcp
    comment: "Nginx Proxy Manager dashboard"
  when: security_allow_npm_dashboard | default(true)

# Database Access (Only from localhost or specific IPs)
- name: Allow MySQL from localhost only
  community.general.ufw:
    rule: allow
    port: "3306"
    proto: tcp
    from_ip: "127.0.0.1"
    comment: "MySQL localhost only"
  when: not (security_allow_mysql_external | default(false))

- name: Allow MySQL from any (if external access enabled)
  community.general.ufw:
    rule: allow
    port: "3306"
    proto: tcp
    comment: "MySQL external access"
  when: security_allow_mysql_external | default(false)

- name: Allow PostgreSQL from localhost only
  community.general.ufw:
    rule: allow
    port: "5432"
    proto: tcp
    from_ip: "127.0.0.1"
    comment: "PostgreSQL localhost only"
  when: not (security_allow_postgres_external | default(false))

- name: Allow PostgreSQL from any (if external access enabled)
  community.general.ufw:
    rule: allow
    port: "5432"
    proto: tcp
    comment: "PostgreSQL external access"
  when: security_allow_postgres_external | default(false)

- name: Allow Redis from localhost only
  community.general.ufw:
    rule: allow
    port: "6379"
    proto: tcp
    from_ip: "127.0.0.1"
    comment: "Redis localhost only"
  when: not (security_allow_redis_external | default(false))

- name: Allow Redis from any (if external access enabled)
  community.general.ufw:
    rule: allow
    port: "6379"
    proto: tcp
    comment: "Redis external access"
  when: security_allow_redis_external | default(false)

# Custom allowed ports
- name: Allow custom ports
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto | default('tcp') }}"
    comment: "{{ item.comment | default('Custom port') }}"
  loop: "{{ security_custom_allowed_ports }}"
  when: security_custom_allowed_ports is defined and security_custom_allowed_ports | length > 0

# IP Whitelisting
- name: Allow specific IPs (whitelist)
  community.general.ufw:
    rule: allow
    from_ip: "{{ item.ip }}"
    comment: "{{ item.comment | default('Whitelisted IP') }}"
  loop: "{{ security_whitelist_ips }}"
  when: security_whitelist_ips is defined and security_whitelist_ips | length > 0

# IP Blacklisting
- name: Deny specific IPs (blacklist)
  community.general.ufw:
    rule: deny
    from_ip: "{{ item.ip }}"
    comment: "{{ item.comment | default('Blacklisted IP') }}"
  loop: "{{ security_blacklist_ips }}"
  when: security_blacklist_ips is defined and security_blacklist_ips | length > 0

# Enable UFW
- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Enable UFW logging
  community.general.ufw:
    logging: "{{ security_ufw_logging_level }}"

- name: Display UFW status
  ansible.builtin.command: ufw status verbose
  register: ufw_status
  changed_when: false

- name: Show UFW configuration
  ansible.builtin.debug:
    msg: "{{ ufw_status.stdout_lines }}"
