---
# System Security Hardening
# Kernel parameters and system-level security

- name: Install security packages
  ansible.builtin.apt:
    name:
      - unattended-upgrades  # Auto security updates
      - apt-listchanges      # Track package changes
      - debsums              # Verify package integrity
      - rkhunter             # Rootkit detection
      - chkrootkit           # Rootkit detection
    state: present
    update_cache: true

# Kernel parameters (sysctl)
- name: Configure kernel security parameters
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: true
    sysctl_file: /etc/sysctl.d/99-security.conf
  loop:
    # IP Forwarding (disable if not a router)
    - { name: "net.ipv4.ip_forward", value: "{{ security_sysctl_ip_forward | default('0') }}" }
    
    # SYN cookies (protect against SYN flood)
    - { name: "net.ipv4.tcp_syncookies", value: "1" }
    
    # Ignore ICMP redirects
    - { name: "net.ipv4.conf.all.accept_redirects", value: "0" }
    - { name: "net.ipv4.conf.default.accept_redirects", value: "0" }
    - { name: "net.ipv6.conf.all.accept_redirects", value: "0" }
    - { name: "net.ipv6.conf.default.accept_redirects", value: "0" }
    
    # Ignore send redirects
    - { name: "net.ipv4.conf.all.send_redirects", value: "0" }
    - { name: "net.ipv4.conf.default.send_redirects", value: "0" }
    
    # Disable source packet routing
    - { name: "net.ipv4.conf.all.accept_source_route", value: "0" }
    - { name: "net.ipv4.conf.default.accept_source_route", value: "0" }
    - { name: "net.ipv6.conf.all.accept_source_route", value: "0" }
    - { name: "net.ipv6.conf.default.accept_source_route", value: "0" }
    
    # Reverse path filtering
    - { name: "net.ipv4.conf.all.rp_filter", value: "1" }
    - { name: "net.ipv4.conf.default.rp_filter", value: "1" }
    
    # Log Martians (packets with impossible addresses)
    - { name: "net.ipv4.conf.all.log_martians", value: "1" }
    - { name: "net.ipv4.conf.default.log_martians", value: "1" }
    
    # Ignore ICMP ping requests
    - { name: "net.ipv4.icmp_echo_ignore_all", value: "{{ security_sysctl_ignore_ping | default('0') }}" }
    
    # Ignore bogus ICMP errors
    - { name: "net.ipv4.icmp_ignore_bogus_error_responses", value: "1" }
    
    # TCP/IP stack hardening
    - { name: "net.ipv4.tcp_timestamps", value: "0" }
    - { name: "net.ipv4.tcp_fin_timeout", value: "15" }
    - { name: "net.ipv4.tcp_keepalive_time", value: "300" }
    - { name: "net.ipv4.tcp_keepalive_probes", value: "5" }
    - { name: "net.ipv4.tcp_keepalive_intvl", value: "15" }
    
    # Increase system IP port limits
    - { name: "net.ipv4.ip_local_port_range", value: "2000 65535" }
    
    # Increase TCP max buffer size
    - { name: "net.core.rmem_max", value: "134217728" }
    - { name: "net.core.wmem_max", value: "134217728" }
    
    # Kernel hardening
    - { name: "kernel.dmesg_restrict", value: "1" }
    - { name: "kernel.kptr_restrict", value: "2" }
    - { name: "kernel.yama.ptrace_scope", value: "1" }
    
    # File system hardening
    - { name: "fs.suid_dumpable", value: "0" }
    - { name: "fs.protected_hardlinks", value: "1" }
    - { name: "fs.protected_symlinks", value: "1" }

# Configure automatic security updates
- name: Configure unattended-upgrades
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    mode: "0644"
    owner: root
    group: root
  when: security_auto_updates | default(true)

- name: Enable automatic security updates
  ansible.builtin.copy:
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::AutocleanInterval "7";
      APT::Periodic::Unattended-Upgrade "1";
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    owner: root
    group: root
  when: security_auto_updates | default(true)

# Secure shared memory
- name: Secure /tmp with noexec
  ansible.posix.mount:
    path: /tmp
    src: tmpfs
    fstype: tmpfs
    opts: defaults,noexec,nosuid,nodev
    state: mounted
  when: security_secure_tmp | default(false)

# File permissions
- name: Set secure permissions on sensitive files
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "{{ item.mode }}"
    owner: root
    group: root
  loop:
    - { path: "/etc/passwd", mode: "0644" }
    - { path: "/etc/shadow", mode: "0640" }
    - { path: "/etc/group", mode: "0644" }
    - { path: "/etc/gshadow", mode: "0640" }
    - { path: "/etc/ssh/sshd_config", mode: "0600" }
  ignore_errors: true

# Disable unnecessary services
- name: Disable unnecessary services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop: "{{ security_disabled_services }}"
  when: 
    - security_disabled_services is defined
    - security_disabled_services | length > 0
  ignore_errors: true

# Check for rootkits
- name: Update rkhunter database
  ansible.builtin.command: rkhunter --update
  changed_when: false
  when: security_enable_rkhunter | default(false)

- name: Run rkhunter check
  ansible.builtin.command: rkhunter --check --skip-keypress --report-warnings-only
  register: rkhunter_check
  changed_when: false
  failed_when: false
  when: security_enable_rkhunter | default(false)

- name: Display system security status
  ansible.builtin.debug:
    msg:
      - "System Security Applied:"
      - "  • Kernel parameters: Hardened (sysctl)"
      - "  • Auto security updates: {{ 'enabled' if security_auto_updates | default(true) else 'disabled' }}"
      - "  • Rootkit detection: {{ 'enabled' if security_enable_rkhunter | default(false) else 'disabled' }}"
      - "  • IP forwarding: {{ 'enabled' if security_sysctl_ip_forward | default('0') == '1' else 'disabled' }}"
      - "  • ICMP ping: {{ 'ignored' if security_sysctl_ignore_ping | default('0') == '1' else 'enabled' }}"
      - "  • TCP SYN cookies: enabled"
      - "  • Reverse path filtering: enabled"
