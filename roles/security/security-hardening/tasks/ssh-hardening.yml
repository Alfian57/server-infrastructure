---
# SSH Hardening Configuration
# Additional security measures for SSH

- name: Prevent SSH hardening lockout for root-based Ansible sessions
  ansible.builtin.assert:
    that:
      - not (
          (security_ssh_harden_config | default(true) | bool)
          and (security_ssh_permit_root_login | string == 'no')
          and (ansible_user | default('') == 'root')
        )
    fail_msg: >-
      Refusing to apply SSH hardening while Ansible is connected as root because
      PermitRootLogin=no would lock out the current access path. Switch
      inventory to a managed non-root user first (for example `make switch-to-ssh`)
      and rerun the playbook.

- name: Build effective SSH allowed users list
  ansible.builtin.set_fact:
    security_ssh_allowed_users_effective: >-
      {{
        (
          security_ssh_allowed_users | default([])
          + (
            [ansible_user]
            if (
              ansible_user is defined
              and ansible_user | length > 0
              and ansible_user != 'root'
            )
            else []
          )
        ) | unique | list
      }}

- name: Backup original sshd_config
  ansible.builtin.copy:
    src: /etc/ssh/sshd_config
    dest: /etc/ssh/sshd_config.backup
    remote_src: true
    mode: "0600"
    force: false

- name: Ensure sshd_config.d directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure Include directive is at the top of sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: "Include /etc/ssh/sshd_config.d/*.conf"
    insertbefore: BOF
    state: present
  when: security_ssh_harden_config | default(true)

- name: Deploy SSH drop-in configuration (00-ansible-hardening.conf)
  ansible.builtin.template:
    src: 00-ansible-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-ansible-hardening.conf
    owner: root
    group: root
    mode: "0600"
  notify: Restart sshd
  when: security_ssh_harden_config | default(true)

- name: Ensure SSH privilege separation directory exists
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Test SSH configuration
  ansible.builtin.command: sshd -t
  register: sshd_test
  changed_when: false
  failed_when: sshd_test.rc != 0

- name: Display SSH hardening status
  ansible.builtin.debug:
    msg:
      - "SSH Hardening Applied (Drop-in):"
      - "  • Root login: {{ security_ssh_permit_root_login }}"
      - "  • Password auth: {{ security_ssh_password_authentication }}"
      - "  • Max auth tries: {{ security_ssh_max_auth_tries }}"
      - "  • Client timeout: {{ security_ssh_client_alive_interval }}s"
      - "  • Allowed users: {{ security_ssh_allowed_users_effective | join(', ') if security_ssh_allowed_users_effective | length > 0 else 'all users' }}"
      - "  • SSH config test: {{ 'PASSED' if sshd_test.rc == 0 else 'FAILED' }}"
