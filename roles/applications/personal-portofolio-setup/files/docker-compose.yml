services:
  personal-portofolio:
    image: ghcr.io/alfian57/personal-portofolio:latest
    container_name: personal-portofolio
    restart: unless-stopped
    networks:
      - nginx_proxy_manager_network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const http = require('http'); const req = http.request({hostname: 'localhost', port: 3000, path: '/', method: 'GET', timeout: 5000}, (res) => { process.exit(res.statusCode >= 200 && res.statusCode < 400 ? 0 : 1); }); req.on('error', () => process.exit(1)); req.on('timeout', () => process.exit(1)); req.end();",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  nginx_proxy_manager_network:
    external: true
