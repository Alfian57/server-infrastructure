---
- name: Validate Guardian Lab host and catalog
  ansible.builtin.assert:
    that:
      - ansible_architecture in ['x86_64', 'amd64']
      - guardian_lab_web_app.enabled | bool
      - guardian_lab_ml_app.enabled | bool
      - guardian_lab_max_sessions | string is match('^[1-3]$')
    fail_msg: "Guardian Lab requires Linux amd64, both catalog entries enabled, and guardian_lab_max_sessions from 1 to 3."
    quiet: true

- name: Check Guardian Lab image state
  ansible.builtin.stat:
    path: "{{ guardian_lab_install_dir }}/images.env"
  register: guardian_lab_image_state

- name: Require full Guardian Lab bootstrap before an ML-only deployment
  ansible.builtin.assert:
    that:
      - guardian_lab_image_state.stat.exists
    fail_msg: "Bootstrap the stack first with make infra ACTION=deploy APP=guardian-lab."
    quiet: true
  when: portfolio_app_filter | default('') == 'guardian-lab-ai'

- name: Configure Guardian Lab stack
  when: portfolio_app_filter | default('') != 'guardian-lab-ai'
  block:
    - name: Validate Guardian Lab runtime secrets
      ansible.builtin.assert:
        that:
          - vault_guardian_lab_db_password | default('') | length >= 32
          - vault_guardian_lab_session_secret | default('') | length >= 32
          - vault_guardian_lab_broker_key | default('') | length >= 32
          - vault_guardian_lab_fonnte_token | default('') | length > 0
          - vault_guardian_lab_deepseek_api_key | default('') | length > 0
        fail_msg: "Configure the Guardian Lab keys in Ansible Vault."
        quiet: true
      no_log: true

    - name: Create Guardian Lab application directory
      ansible.builtin.file:
        path: "{{ guardian_lab_install_dir }}"
        state: directory
        mode: "0750"
        owner: "{{ guardian_lab_admin_user }}"
        group: "{{ guardian_lab_runtime_group }}"

    - name: Render Guardian Lab secret environment
      ansible.builtin.template:
        src: "{{ (playbook_dir ~ '/../' ~ guardian_lab_web_app.env_template) if item.src == '.env.j2' else item.src }}"
        dest: "{{ guardian_lab_install_dir }}/{{ item.dest }}"
        mode: "0640"
        owner: "{{ guardian_lab_admin_user }}"
        group: "{{ guardian_lab_runtime_group }}"
      loop:
        - {src: ".env.j2", dest: ".env"}
        - {src: "broker.env.j2", dest: "broker.env"}
      no_log: true

    - name: Render Guardian Lab deployment configuration
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ guardian_lab_install_dir }}/{{ item.dest }}"
        mode: "{{ item.mode | default('0640') }}"
        owner: "{{ guardian_lab_admin_user }}"
        group: "{{ guardian_lab_runtime_group }}"
      loop:
        - {src: "docker-compose.yml.j2", dest: "docker-compose.yml"}
        - {src: "deployment.env.j2", dest: "deployment.env"}
        - {src: "stream.conf.j2", dest: "stream.conf", mode: "0644"}
        - {src: "ml.env.j2", dest: "ml.env"}
      register: guardian_lab_config_render

    - name: Inspect the Guardian stream gateway
      community.docker.docker_container_info:
        name: guardian-lab-stream
      register: guardian_lab_stream_container
      no_log: true
      when: not ansible_check_mode

    - name: Restart the Guardian stream gateway after configuration changes
      ansible.builtin.command:
        argv: [docker, restart, guardian-lab-stream]
      when:
        - not ansible_check_mode
        - guardian_lab_stream_container.exists | default(false)
        - guardian_lab_config_render.changed | default(false)

    - name: Initialize Guardian Lab image state without replacing deployed pins
      ansible.builtin.template:
        src: images.env.j2
        dest: "{{ guardian_lab_install_dir }}/images.env"
        force: false
        mode: "0640"
        owner: "{{ guardian_lab_admin_user }}"
        group: "{{ guardian_lab_runtime_group }}"

    - name: Install Guardian Lab deployment helper
      ansible.builtin.copy:
        src: update.sh
        dest: "{{ guardian_lab_install_dir }}/update.sh"
        mode: "0750"
        owner: "{{ guardian_lab_admin_user }}"
        group: "{{ guardian_lab_runtime_group }}"

    - name: Ensure Guardian Lab external networks exist
      community.docker.docker_network:
        name: "{{ item }}"
        state: present
      loop:
        - "{{ nginx_proxy_network }}"
        - "{{ mysql_network }}"
      when: not ansible_check_mode

- name: Deploy Guardian Lab through the shared lock and strict readiness checks
  ansible.builtin.command:
    argv:
      - "{{ guardian_lab_install_dir }}/update.sh"
      - "{{ 'ml' if portfolio_app_filter | default('') == 'guardian-lab-ai' else 'all' }}"
    chdir: "{{ guardian_lab_install_dir }}"
  become: true
  become_user: "{{ guardian_lab_admin_user }}"
  register: guardian_lab_deploy

- name: Display Guardian Lab deployment status
  ansible.builtin.debug:
    msg: "{{ guardian_lab_deploy.stdout | default('Guardian Lab configuration prepared in check mode.') }}"
