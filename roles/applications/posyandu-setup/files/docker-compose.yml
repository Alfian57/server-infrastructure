services:
  posyandu:
    image: ghcr.io/alfian57/posyandu:latest
    container_name: posyandu
    restart: unless-stopped
    volumes:
      - ./.env:/var/www/.env:ro
      - posyandu_storage:/var/www/storage
    networks:
      - nginx_proxy_manager_network
      - mysql_network
      - redis_network
    healthcheck:
      test: ["CMD", "sh", "-c", "pidof nginx && pidof php-fpm"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  nginx_proxy_manager_network:
    external: true
  mysql_network:
    external: true
  redis_network:
    external: true

volumes:
  posyandu_storage:
