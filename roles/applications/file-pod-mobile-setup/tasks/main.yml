---
# File Pod Mobile Setup - Configure GitHub Repository Variables for Flutter CI/CD
# This role sets up GitHub repository variables for the Flutter mobile app CI/CD build

- name: Check if gh CLI is available
  ansible.builtin.command: which gh
  register: gh_check
  failed_when: false
  changed_when: false
  become: true
  become_user: deployer

- name: Verify GitHub CLI authentication
  ansible.builtin.command: gh auth status
  register: gh_auth_status
  failed_when: false
  changed_when: false
  become: true
  become_user: deployer
  when: gh_check.rc == 0

- name: Set GitHub repository variable - BASE_URL
  ansible.builtin.command:
    cmd: gh variable set BASE_URL --repo "{{ github_owner }}/{{ github_repo }}" --body "{{ file_pod_api_url }}"
  become: true
  become_user: deployer
  register: base_url_result
  changed_when: base_url_result.rc == 0
  failed_when: false
  when:
    - gh_check.rc == 0
    - gh_auth_status.rc == 0

- name: Display result
  ansible.builtin.debug:
    msg: |
      GitHub variable configuration for {{ github_owner }}/{{ github_repo }}:
      ✓ BASE_URL = {{ file_pod_api_url }}
  when: base_url_result.rc is defined and base_url_result.rc == 0

- name: Display warning if gh CLI not available
  ansible.builtin.debug:
    msg: "⚠ GitHub CLI not available or not authenticated. Skipping GitHub variable configuration."
  when: gh_check.rc != 0 or (gh_auth_status.rc is defined and gh_auth_status.rc != 0)
