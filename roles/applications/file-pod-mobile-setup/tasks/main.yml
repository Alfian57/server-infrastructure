---
# File Pod Mobile Setup
# ======================
# NOTE: GitHub repository variables (BASE_URL) are now configured via LOCAL script:
#   ./scripts/update-github-secrets-local.sh
#
# This role is kept as a placeholder for any future server-side configuration
# needed for the mobile app (currently none required).

- name: Display File Pod Mobile configuration note
  ansible.builtin.debug:
    msg: |
      ══════════════════════════════════════════════════════════════════
      📱 File Pod Mobile - Configuration via Local Script
      ══════════════════════════════════════════════════════════════════
      
      GitHub repository variable (BASE_URL) is now configured via:
        ./scripts/update-github-secrets-local.sh
      
      Or run: make update-github-secrets
      
      This ensures all GitHub CLI operations run from your local machine
      or CI runner, not from the server.
      ══════════════════════════════════════════════════════════════════

