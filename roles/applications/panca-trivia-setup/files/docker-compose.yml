services:
  panca-trivia:
    image: ghcr.io/alfian57/panca-trivia:latest
    container_name: panca-trivia
    restart: unless-stopped
    volumes:
      - ./.env:/var/www/.env:ro
      - panca_trivia_storage:/var/www/storage
    networks:
      - nginx_proxy_manager_network
      - mysql_network
    healthcheck:
      test: ["CMD", "sh", "-c", "pidof nginx && pidof php-fpm"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: sh -c "php artisan config:cache && php artisan optimize && php-fpm & nginx -g 'daemon off;'"

networks:
  nginx_proxy_manager_network:
    external: true
  mysql_network:
    external: true

volumes:
  panca_trivia_storage:
