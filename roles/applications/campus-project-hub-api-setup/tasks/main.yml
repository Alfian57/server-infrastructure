---
- name: Deploy Campus Project Hub API application
  ansible.builtin.include_tasks: ../../common/tasks/deploy-golang-app.yml
  vars:
    app_name: "campus-project-hub-api"
    requires_database: true
    requires_redis: false
    create_data_dir: true
    # Enable fresh migration + seeding on first deploy (set to false after)
    run_fresh_migrate: "{{ campus_project_hub_api_fresh_migrate | default(true) }}"
    run_seeder: "{{ campus_project_hub_api_run_seeder | default(true) }}"
