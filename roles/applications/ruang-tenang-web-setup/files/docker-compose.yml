services:
  ruang-tenang-web:
    image: ghcr.io/alfian57/ruang-tenang-web:latest
    container_name: ruang-tenang-web
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - nginx_proxy_manager_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  nginx_proxy_manager_network:
    external: true
