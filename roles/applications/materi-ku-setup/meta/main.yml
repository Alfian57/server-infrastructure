      versions:
        - focal
        - jammy
        - noble
    - name: Debian
      versions:
        - bullseye
        - bookworm
  galaxy_tags:
    - application
    - laravel
    - php
    - docker

dependencies:
  - role: docker-setup
  - role: mysql-setup
  - role: nginx-proxy-setup

# Required collections
collections:
  - community.docker
