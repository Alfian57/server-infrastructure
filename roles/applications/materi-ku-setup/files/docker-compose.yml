services:
  materi-ku:
    image: ghcr.io/alfian57/materi-ku:latest
    container_name: materi-ku
    restart: unless-stopped
    volumes:
      - ./.env:/var/www/.env:ro
      - materi_ku_storage:/var/www/storage
      - materi_ku_bootstrap_cache:/var/www/bootstrap/cache
    networks:
      - nginx_proxy_manager_network
      - mysql_network
    healthcheck:
      test: ["CMD", "sh", "-c", "pidof nginx && pidof php-fpm"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: sh -c "php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan optimize && php-fpm & nginx -g 'daemon off;'"

networks:
  nginx_proxy_manager_network:
    external: true
  mysql_network:
    external: true

volumes:
  materi_ku_storage:
  materi_ku_bootstrap_cache:
