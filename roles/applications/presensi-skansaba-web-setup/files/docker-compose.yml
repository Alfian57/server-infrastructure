services:
  presensi-skansaba-web:
    image: ghcr.io/alfian57/presensi-skansaba-web:latest
    container_name: presensi-skansaba-web
    restart: unless-stopped
    volumes:
      - ./.env:/var/www/html/.env:ro
      - presensi_skansaba_web_storage:/var/www/html/storage
    networks:
      - nginx_proxy_manager_network
      - mysql_network
      - redis_network
    healthcheck:
      test: ["CMD", "sh", "-c", "pidof nginx && pidof php-fpm"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  nginx_proxy_manager_network:
    external: true
  mysql_network:
    external: true
  redis_network:
    external: true

volumes:
  presensi_skansaba_web_storage:
