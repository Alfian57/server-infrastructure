services:
  solvo:
    image: ghcr.io/alfian57/solvo:latest
    container_name: solvo
    restart: unless-stopped
    volumes:
      - ./.env:/var/www/html/.env:ro
      - solvo_storage:/var/www/html/storage
      - solvo_bootstrap_cache:/var/www/html/bootstrap/cache
    networks:
      - nginx_proxy_manager_network
      - mysql_network
      - redis_network
    healthcheck:
      test: ["CMD", "sh", "-c", "pidof nginx && pidof php-fpm"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  nginx_proxy_manager_network:
    external: true
  mysql_network:
    external: true
  redis_network:
    external: true

volumes:
  solvo_storage:
  solvo_bootstrap_cache:
